<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenGadda — Ricerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1814; --paper: #f5f0e8; --accent: #7a3b1e; --accent-light: #c8794a;
  --muted: #7a7268; --border: #c8bfaa; --white: #fdfaf5; --tag-bg: #e8dfd0; --tag-text: #7a3b1e;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'EB Garamond',Georgia,serif; background:var(--paper); color:var(--ink); }
nav { background:var(--ink); border-bottom:2px solid var(--accent); display:flex; align-items:center; padding:0 2.5rem; gap:2rem; height:52px; position:sticky; top:0; z-index:100; }
.nav-brand { font-family:'DM Mono',monospace; font-size:13px; letter-spacing:0.18em; color:var(--white); text-decoration:none; margin-right:auto; }
nav a { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#9a9080; text-decoration:none; transition:color 0.2s; }
nav a:hover { color:#e8c89a; }
nav a.nav-cat:hover { color: var(--cat-color); }

/* ── NAV SEARCH BUTTON (matches the "⌕ Cerca" button on every other page) ── */
.nav-search-btn {
  margin-left: auto; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12); border-radius: 4px;
  padding: 4px 10px; cursor: pointer; color: rgba(255,255,255,0.4);
  font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em;
  display: flex; align-items: center; gap: 6px; transition: all 0.2s;
  text-decoration: none;
}
.nav-search-btn:hover { border-color: var(--accent-light); color: var(--accent-light); }

header { background:var(--ink); color:var(--white); padding:2.5rem 2.5rem 2rem; border-bottom:3px solid var(--accent); }
header .eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#5a5248; margin-bottom:0.5rem; }
header h1 { font-size:2.4rem; font-weight:400; font-style:italic; margin-bottom:0.4rem; }
header p { color:#9a9080; font-size:1rem; }

.layout { display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 180px); }
.sidebar { background:var(--white); border-right:1px solid var(--border); padding:1.5rem 1.25rem; position:sticky; top:52px; height:calc(100vh - 52px); overflow-y:auto; }
.sidebar-section { margin-bottom:1.75rem; }
.sidebar-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:0.6rem; display:block; }
.sidebar input[type=text] { width:100%; padding:0.5rem 0.6rem; font-family:'EB Garamond',serif; font-size:1rem; border:1px solid var(--border); background:var(--paper); color:var(--ink); border-radius:2px; outline:none; }
.sidebar input[type=text]:focus { border-color:var(--accent); }
.filter-group { display:flex; flex-direction:column; gap:3px; }
.filter-btn { text-align:left; background:none; border:none; padding:0.3rem 0.5rem; font-family:'EB Garamond',serif; font-size:0.9rem; color:var(--muted); cursor:pointer; border-radius:2px; display:flex; justify-content:space-between; align-items:center; transition:background 0.15s,color 0.15s; }
.filter-btn:hover { background:var(--tag-bg); color:var(--ink); }
.filter-btn.active { background:var(--accent); color:var(--white); }
.filter-btn .count { font-family:'DM Mono',monospace; font-size:10px; opacity:0.7; flex-shrink:0; margin-left:6px; }

.main { padding:1.5rem 2rem; }
.stats-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:3px; margin-bottom:1.25rem; overflow:hidden; }
.stat { background:var(--white); padding:0.75rem 1rem; text-align:center; }
.stat-n { font-family:'DM Mono',monospace; font-size:1.3rem; font-weight:500; color:var(--accent); display:block; }
.stat-l { font-size:0.8rem; color:var(--muted); }

.entry { border-bottom:1px solid var(--border); padding:0.9rem 0.25rem; display:grid; grid-template-columns:64px 1fr auto; gap:0.75rem; align-items:start; transition:background 0.15s; cursor:pointer; }
.entry:hover { background:var(--white); padding-left:0.5rem; padding-right:0.5rem; margin:0 -0.25rem; }
.entry-year { font-family:'DM Mono',monospace; font-size:11px; color:var(--accent); padding-top:3px; text-align:right; }
.entry-title { font-size:1rem; font-weight:500; line-height:1.3; color:var(--ink); margin-bottom:3px; }
.entry-source { font-family:'DM Mono',monospace; font-size:10px; color:#9a9080; letter-spacing:0.04em; }
.type-tag { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.1em; text-transform:uppercase; background:var(--tag-bg); color:var(--tag-text); padding:2px 6px; border-radius:2px; white-space:nowrap; flex-shrink:0; align-self:start; margin-top:3px; }

.section-header { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); padding:1.25rem 0.25rem 0.4rem; border-top:2px solid var(--border); margin-top:0.5rem; display:flex; justify-content:space-between; align-items:center; }
.section-header:first-child { border-top:none; margin-top:0; padding-top:0.4rem; }
.section-header a { font-size:9px; color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent); }
.section-header a:hover { opacity:0.7; }

.no-results { text-align:center; padding:4rem 1rem; color:var(--muted); font-style:italic; font-size:1.1rem; }
.pagination { display:flex; gap:6px; justify-content:center; margin-top:2rem; flex-wrap:wrap; }
.page-btn { font-family:'DM Mono',monospace; font-size:11px; border:1px solid var(--border); background:none; color:var(--muted); padding:4px 12px; cursor:pointer; border-radius:2px; }
.page-btn.active { background:var(--ink); color:var(--white); border-color:var(--ink); }
.page-btn:hover:not(.active) { background:var(--tag-bg); }

@media(max-width:700px) { .layout { grid-template-columns:1fr; } .sidebar { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); } }

.conn-badges { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.conn-badge { font-family:'DM Mono',monospace; font-size:9px; padding:1px 6px; border-radius:2px; font-weight:600; letter-spacing:0.05em; white-space:nowrap; cursor:pointer; }

/* ── SEARCH OVERLAY (same quick-search used on every other page) ── */
.search-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(20,18,14,0.82);
  display: flex; flex-direction: column; align-items: center;
  padding-top: 80px;
  opacity: 0; pointer-events: none; transition: opacity 0.18s;
}
.search-overlay.open { opacity: 1; pointer-events: all; }
.overlay-box { width: min(640px, 90vw); }
.overlay-input-wrap { position: relative; margin-bottom: 8px; }
.overlay-input {
  width: 100%; background: var(--white); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.85rem 3rem 0.85rem 1.1rem;
  font-family: 'EB Garamond', Georgia, serif; font-size: 1.15rem;
  color: var(--ink); outline: none;
}
.overlay-input:focus { border-color: var(--accent); }
.overlay-close {
  position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); font-size: 1.2rem;
  cursor: pointer; padding: 0;
}
.s-results { background: var(--white); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; max-height: 420px; overflow-y: auto; display: none; }
.s-results.open { display: block; }
.s-result { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 10px; align-items: baseline; transition: background 0.1s; }
.s-result:last-of-type { border-bottom: none; }
.s-result:hover { background: var(--paper); }
.s-year { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); flex-shrink: 0; }
.s-badge { font-family: 'DM Mono', monospace; font-size: 9px; padding: 1px 5px; border-radius: 2px; white-space: nowrap; flex-shrink: 0; }
.s-title { font-size: 0.9rem; font-weight: 500; color: var(--ink); line-height: 1.3; }
.s-sub { font-size: 0.82rem; color: var(--muted); }
.s-hint { padding: 0.5rem 1rem; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--border); background: var(--paper); }
.s-empty, .s-loading { padding: 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; font-style: italic; }

/* ── ADVANCED SEARCH PANEL ── */
.adv-toggle-btn { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.35); padding: 4px 0; margin-top: 6px; display: block; transition: color 0.15s; }
.adv-toggle-btn:hover { color: rgba(255,255,255,0.7); }
.adv-panel { display: none; margin-top: 10px; background: var(--white); border: 1px solid var(--border); border-radius: 6px; padding: 1.25rem; }
.adv-panel.open { display: block; }
.adv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.adv-field label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.adv-field input { width: 100%; padding: 6px 8px; font-family: 'EB Garamond', serif; font-size: 1rem; border: 1px solid var(--border); background: var(--paper); color: var(--ink); border-radius: 2px; outline: none; }
.adv-field input:focus { border-color: var(--accent); }
.adv-year-wrap { display: flex; gap: 6px; align-items: center; }
.adv-year-wrap input { font-family: 'DM Mono', monospace; font-size: 12px; }
.adv-year-wrap span { color: var(--muted); flex-shrink: 0; }
.adv-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.adv-cats label { font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: var(--ink); }
.adv-actions { display: flex; gap: 8px; }
.adv-btn-run { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent); color: #fff; border: none; padding: 6px 18px; border-radius: 2px; cursor: pointer; }
.adv-btn-clear { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: none; color: var(--muted); border: 1px solid var(--border); padding: 5px 14px; border-radius: 2px; cursor: pointer; }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">OpenGadda</a>
  <a href="opere.html">Opere</a>
  <a href="archive.html" class="nav-cat" style="--cat-color:#c98a55">Archivi</a>
  <a href="primary_bibliography.html" class="nav-cat" style="--cat-color:#4fbf85">Bib. primaria</a>
  <a href="secondary_bibliography.html" class="nav-cat" style="--cat-color:#6fa3d8">Bib. secondaria</a>
  <a href="library.html" class="nav-cat" style="--cat-color:#e0955a">Biblioteca</a>
  <a href="epistolario.html" class="nav-cat" style="--cat-color:#a875cf">Epistolario</a>
  <a href="translations.html" class="nav-cat" style="--cat-color:#cdb85a">Traduzioni</a>
  <button class="nav-search-btn" id="overlay-open-btn" aria-label="Apri ricerca">⌕ Cerca</button>
</nav>

<header>
  <div class="eyebrow">Ricerca nel dataset</div>
  <h1 id="header-title">Risultati</h1>
  <p id="header-sub"></p>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">Affina la ricerca</span>
      <input type="text" id="search" placeholder="Modifica ricerca…" oninput="applyFilters()">
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Sezione</span>
      <div class="filter-group" id="cat-btns"></div>
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Ordinamento</span>
      <div class="filter-group">
        <button class="filter-btn active" onclick="setSort('year')" id="s-year">Cronologico</button>
        <button class="filter-btn" onclick="setSort('cat')" id="s-cat">Per sezione</button>
        <button class="filter-btn" onclick="setSort('title')" id="s-title">Titolo</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="stats-bar">
      <div class="stat"><span class="stat-n" id="sn-total">0</span><span class="stat-l">risultati</span></div>
      <div class="stat"><span class="stat-n" id="sn-cats">0</span><span class="stat-l">sezioni</span></div>
      <div class="stat"><span class="stat-n" id="sn-years">0</span><span class="stat-l">anni distinti</span></div>
    </div>
    <div id="entries"></div>
    <div id="pagination" class="pagination"></div>
  </main>
</div>

<div class="search-overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Ricerca globale">
  <div class="overlay-box">
    <div class="overlay-input-wrap">
      <input id="overlay-search" class="overlay-input" type="text" placeholder="Cerca in tutto l'archivio…" autocomplete="off" spellcheck="false">
      <button class="overlay-close" id="overlay-close-btn" aria-label="Chiudi">✕</button>
    </div>
    <button class="adv-toggle-btn" id="adv-toggle-btn">Ricerca avanzata ▾</button>
    <div class="adv-panel" id="adv-panel">
      <div class="adv-grid">
        <div class="adv-field">
          <label>Titolo</label>
          <input id="adv-title" type="text" placeholder="es. Pasticciaccio">
        </div>
        <div class="adv-field">
          <label>Autore / Persona</label>
          <input id="adv-author" type="text" placeholder="es. Contini, Gianfranco">
        </div>
        <div class="adv-field">
          <label>Editore / Rivista</label>
          <input id="adv-pub" type="text" placeholder="es. Einaudi">
        </div>
        <div class="adv-field">
          <label>Anno (da — a)</label>
          <div class="adv-year-wrap">
            <input id="adv-from" type="number" placeholder="1900">
            <span>—</span>
            <input id="adv-to" type="number" placeholder="2025">
          </div>
        </div>
      </div>
      <div class="adv-cats" id="adv-cats">
        <label><input type="checkbox" value="archive" checked> Archivi</label>
        <label><input type="checkbox" value="primary bibliography" checked> Bib. primaria</label>
        <label><input type="checkbox" value="secondary bibliography" checked> Bib. secondaria</label>
        <label><input type="checkbox" value="library" checked> Biblioteca</label>
        <label><input type="checkbox" value="letter" checked> Epistolario</label>
        <label><input type="checkbox" value="translation" checked> Traduzioni</label>
      </div>
      <div class="adv-actions">
        <button class="adv-btn-run" id="adv-run">Cerca</button>
        <button class="adv-btn-clear" id="adv-clear">Azzera</button>
      </div>
    </div>
    <div class="s-results" id="overlay-results"></div>
  </div>
</div>

<script>
const PER_PAGE = 60;
const CAT_LABELS = {"library":"Biblioteca","secondary bibliography":"Bib. secondaria","primary bibliography":"Bib. primaria","archive":"Archivio","letter":"Epistolario","translation":"Traduzioni"};
const CAT_PAGES  = {"library":"library.html","secondary bibliography":"secondary_bibliography.html","primary bibliography":"primary_bibliography.html","archive":"archive.html","letter":"epistolario.html","translation":"translations.html"};
const CAT_COLORS = {"library":"#7a3b1e","secondary bibliography":"#1e4a7a","primary bibliography":"#1a6a40","archive":"#6a3a1a","letter":"#5a1e7a","translation":"#6a5a1a"};

let ALL_DATA = [];
let filtered = [];
let activeQuery = '';
let activeCat = null;
let sortKey = 'year';
let sortDir = 1;
let currentPage = 1;
let CONN_SUMMARY = {};

function applyFilters() {
  const raw = document.getElementById('search').value.toLowerCase() || activeQuery.toLowerCase();
  const q = raw.replace(/,/g, '').replace(/\s+/g, ' ').trim();
  filtered = ALL_DATA.filter(d => {
    if (activeCat && d.category !== activeCat) return false;
    const names = (d.people||[]).map(p => p.name);
    const namesNorm = names.map(n => n.replace(/,/g, ''));
    const namesReversed = namesNorm.map(n => {
      const parts = n.trim().split(/\s+/);
      return parts.length >= 2 ? parts.slice(1).join(' ') + ' ' + parts[0] : n;
    });
    const haystack = [d.title, d.subtitle, d.detail, d.archivio, d.fondo,
                      d.casa_editrice, d.luogo_di_pubblicazione, d.opera,
                      ...names, ...namesNorm, ...namesReversed,
                      ...(d.themes||[])].filter(Boolean).join(' ').replace(/,/g, '').toLowerCase();
    return haystack.includes(q);
  });
  doSort(); currentPage = 1; buildCatBtns(); render();
}

// Matches a person name regardless of word order/format, so a query typed as
// "Name Surname" still finds a name stored as "Surname Name" (or "Surname, Name").
function nameMatches(name, query) {
  const n = (name || '').toLowerCase();
  const tokens = (query || '').toLowerCase().split(/[,\s]+/).filter(Boolean);
  return tokens.length > 0 && tokens.every(t => n.indexOf(t) !== -1);
}

function alphaSortKey(name) {
  let s = (name || '').trim();
  let changed = true;
  while (changed) {
    changed = false;
    const noQuote = s.replace(/^[\s"'“”‘’«»″]+/, '');
    if (noQuote !== s) { s = noQuote; changed = true; }
    const noParen = s.replace(/^\([^)]*\)\s*/, '');
    if (noParen !== s) { s = noParen; changed = true; }
  }
  return s;
}

function doSort() {
  filtered.sort((a, b) => {
    if (sortKey === 'year') return sortDir * ((a.year||0) - (b.year||0));
    if (sortKey === 'cat') return (a.category||'').localeCompare(b.category||'');
    return sortDir * alphaSortKey(a.title).localeCompare(alphaSortKey(b.title), 'it');
  });
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  ['year','cat','title'].forEach(k => document.getElementById('s-'+k).classList.toggle('active', k === key));
  doSort(); render();
}

function entryHtml(d) {
  const col = CAT_COLORS[d.category] || '#888';
  const catLabel = CAT_LABELS[d.category] || d.category;
  const subtitle = d.subtitle && d.subtitle !== d.title ? d.subtitle : '';
  const detail = d.detail || '';
  const source = [subtitle, detail].filter(Boolean).join(' · ');
  return `<div class="entry" onclick="window.location.href='detail.html?id=${d.id}'">
    <div class="entry-year">${d.year||'—'}</div>
    <div>
      <div class="entry-title">${d.title||''}</div>
      ${source ? `<div class="entry-source">${source}</div>` : ''}
    </div>
    <span class="type-tag" style="background:${col}18;color:${col};border:1px solid ${col}30">${catLabel}</span>
  </div>`;
}

function render() {
  document.getElementById('sn-total').textContent = filtered.length.toLocaleString('it');
  document.getElementById('sn-cats').textContent = new Set(filtered.map(d => d.category)).size;
  document.getElementById('sn-years').textContent = new Set(filtered.map(d => d.year).filter(Boolean)).size;

  if (!filtered.length) {
    document.getElementById('entries').innerHTML = '<div class="no-results">Nessun risultato trovato.</div>';
    document.getElementById('pagination').innerHTML = ''; return;
  }

  if (sortKey === 'cat') {
    // Group by section
    const groups = {};
    filtered.forEach(d => {
      if (!groups[d.category]) groups[d.category] = [];
      groups[d.category].push(d);
    });
    const order = ['primary bibliography','secondary bibliography','library','archive','letter','translation'];
    const cats = order.filter(c => groups[c]);
    document.getElementById('entries').innerHTML = cats.map(cat => {
      const label = CAT_LABELS[cat] || cat;
      const page = CAT_PAGES[cat] || '#';
      const items = groups[cat];
      return `<div class="section-header"><span>${label} (${items.length})</span><a href="${page}">Vai alla sezione →</a></div>` +
        items.map(entryHtml).join('');
    }).join('');
    document.getElementById('pagination').innerHTML = '';
  } else {
    const start = (currentPage-1)*PER_PAGE;
    const page = filtered.slice(start, start+PER_PAGE);
    document.getElementById('entries').innerHTML = page.map(entryHtml).join('');
    const totalPages = Math.ceil(filtered.length/PER_PAGE);
    let pages = '';
    for (let i=1; i<=totalPages; i++) {
      if (i===1||i===totalPages||Math.abs(i-currentPage)<=3)
        pages += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if (Math.abs(i-currentPage)===4)
        pages += `<span style="padding:4px;color:#999;font-size:11px">…</span>`;
    }
    document.getElementById('pagination').innerHTML = pages;
  }
}

function goPage(n) { currentPage=n; render(); window.scrollTo(0,0); }

function buildCatBtns() {
  // Count per category ignoring activeCat (so all section counts remain visible)
  const raw = document.getElementById('search').value.toLowerCase() || activeQuery.toLowerCase();
  const q = raw.replace(/,/g, '').replace(/\s+/g, ' ').trim();
  const pool = ALL_DATA.filter(d => {
    const names = (d.people||[]).map(p => p.name);
    const namesNorm = names.map(n => n.replace(/,/g, ''));
    const namesReversed = namesNorm.map(n => {
      const parts = n.trim().split(/\s+/);
      return parts.length >= 2 ? parts.slice(1).join(' ') + ' ' + parts[0] : n;
    });
    const haystack = [d.title, d.subtitle, d.detail, d.archivio, d.fondo,
                      d.casa_editrice, d.luogo_di_pubblicazione, d.opera,
                      ...names, ...namesNorm, ...namesReversed,
                      ...(d.themes||[])].filter(Boolean).join(' ').replace(/,/g, '').toLowerCase();
    return haystack.includes(q);
  });
  const counts = {};
  pool.forEach(d => { counts[d.category] = (counts[d.category]||0)+1; });
  const total = pool.length;

  const container = document.getElementById('cat-btns');
  container.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn' + (!activeCat ? ' active' : '');
  allBtn.innerHTML = `Tutte le sezioni <span class="count">${total}</span>`;
  allBtn.onclick = () => { activeCat = null; applyFilters(); };
  container.appendChild(allBtn);
  const order = ['primary bibliography','secondary bibliography','library','archive','letter','translation'];
  order.forEach(cat => {
    const cnt = counts[cat];
    if (!cnt) return;
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (activeCat === cat ? ' active' : '');
    btn.innerHTML = `${CAT_LABELS[cat]||cat} <span class="count">${cnt}</span>`;
    btn.onclick = () => { activeCat = cat; applyFilters(); };
    container.appendChild(btn);
  });
}

fetch('items.json').then(r=>r.json()).then(data => {
  ALL_DATA = data;
  const urlQ = new URLSearchParams(window.location.search).get('q') || '';
  activeQuery = decodeURIComponent(urlQ);
  document.getElementById('search').value = activeQuery;
  document.getElementById('header-title').textContent = '"' + activeQuery + '"';
  applyFilters();
  buildCatBtns();
  document.getElementById('header-sub').textContent = filtered.length + ' risultati in tutto il dataset';
}).catch(err => {
  document.getElementById('entries').innerHTML = '<p style="padding:2rem;color:#c00;font-family:monospace">Errore: ' + err + '</p>';
});

// ── Search overlay (same quick-search as on every other page) ──────────────
(function() {
  function renderOverlayResults(hits, q, container) {
    container.innerHTML = '';
    if (!hits.length) {
      var empty = document.createElement('div');
      empty.className = 's-empty';
      empty.textContent = 'Nessun risultato per «' + q + '»';
      container.appendChild(empty);
      container.classList.add('open');
      return;
    }
    hits.forEach(function(d) {
      var col = CAT_COLORS[d.category] || '#888';
      var lbl = CAT_LABELS[d.category] || d.category;
      var row = document.createElement('div');
      row.className = 's-result';
      row.dataset.id = d.id;
      var year = document.createElement('span');
      year.className = 's-year';
      year.textContent = d.year;
      var badge = document.createElement('span');
      badge.className = 's-badge';
      badge.style.cssText = 'background:' + col + '18;color:' + col + ';border:1px solid ' + col + '40';
      badge.textContent = lbl;
      var info = document.createElement('div');
      var title = document.createElement('div');
      title.className = 's-title';
      title.textContent = d.title || '';
      info.appendChild(title);
      if (d.subtitle && d.subtitle !== d.title) {
        var sub = document.createElement('div');
        sub.className = 's-sub';
        sub.textContent = d.subtitle;
        info.appendChild(sub);
      }
      row.appendChild(year);
      row.appendChild(badge);
      row.appendChild(info);
      container.appendChild(row);
    });
    var hint = document.createElement('div');
    hint.className = 's-hint';
    hint.textContent = hits.length === 30 ? 'Primi 30 risultati — affina la ricerca' : hits.length + ' risultati';
    container.appendChild(hint);
    container.classList.add('open');
  }

  document.addEventListener('click', function(e) {
    var row = e.target.closest('.s-result[data-id]');
    if (row) { window.location.href = 'detail.html?id=' + row.dataset.id; }
  });

  function overlaySearch(q, container) {
    if (!q || q.length < 2) { container.classList.remove('open'); return; }
    if (!ALL_DATA || !ALL_DATA.length) {
      container.innerHTML = '<div class="s-loading">Caricamento…</div>';
      container.classList.add('open');
      setTimeout(function() { overlaySearch(q, container); }, 200);
      return;
    }
    var ql = q.toLowerCase();
    var hits = ALL_DATA.filter(function(d) {
      return (d.title||'').toLowerCase().includes(ql) ||
             (d.subtitle||'').toLowerCase().includes(ql) ||
             (d.detail||'').toLowerCase().includes(ql) ||
             (d.people||[]).some(function(p) { return nameMatches(p.name, ql); });
    }).slice(0, 30);
    renderOverlayResults(hits, q, container);
  }

  function bindInput(inputEl, resultsEl) {
    var t;
    inputEl.addEventListener('input', function() {
      clearTimeout(t);
      var q = this.value.trim();
      if (q.length < 2) { resultsEl.classList.remove('open'); return; }
      t = setTimeout(function() { overlaySearch(q, resultsEl); }, 200);
    });
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { resultsEl.classList.remove('open'); inputEl.value = ''; }
    });
  }

  var overlay = document.getElementById('search-overlay');
  var overlayInput = document.getElementById('overlay-search');
  var overlayResults = document.getElementById('overlay-results');
  var openBtn = document.getElementById('overlay-open-btn');
  var closeBtn = document.getElementById('overlay-close-btn');
  var advToggle = document.getElementById('adv-toggle-btn');
  var advPanel = document.getElementById('adv-panel');

  advToggle.addEventListener('click', function() {
    var open = advPanel.classList.toggle('open');
    advToggle.textContent = open ? 'Ricerca avanzata ▴' : 'Ricerca avanzata ▾';
  });

  document.getElementById('adv-run').addEventListener('click', function() {
    var title  = document.getElementById('adv-title').value.trim().toLowerCase();
    var author = document.getElementById('adv-author').value.trim().toLowerCase();
    var pub    = document.getElementById('adv-pub').value.trim().toLowerCase();
    var from   = parseInt(document.getElementById('adv-from').value) || 0;
    var to     = parseInt(document.getElementById('adv-to').value) || 9999;
    var cats   = Array.from(document.querySelectorAll('#adv-cats input:checked')).map(function(c){ return c.value; });
    var hits = (ALL_DATA||[]).filter(function(d) {
      if (!cats.includes(d.category)) return false;
      if (d.year < from || d.year > to) return false;
      if (title  && !(d.title||'').toLowerCase().includes(title)) return false;
      if (author && !(d.people||[]).some(function(p){ return nameMatches(p.name, author); })) return false;
      if (pub    && ![(d.detail||''),(d.editore||''),(d.rivista||''),(d.casa_editrice||'')].join(' ').toLowerCase().includes(pub)) return false;
      return true;
    }).slice(0, 40);
    renderOverlayResults(hits, title || author || pub || 'ricerca avanzata', overlayResults);
  });

  document.getElementById('adv-clear').addEventListener('click', function() {
    ['adv-title','adv-author','adv-pub','adv-from','adv-to'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.querySelectorAll('#adv-cats input').forEach(function(c){ c.checked = true; });
    overlayResults.classList.remove('open');
  });

  function openOverlay() {
    overlay.classList.add('open');
    setTimeout(function() { overlayInput.focus(); }, 50);
  }
  function closeOverlay() {
    overlay.classList.remove('open');
    overlayInput.value = '';
    overlayResults.classList.remove('open');
    advPanel.classList.remove('open');
    advToggle.textContent = 'Ricerca avanzata ▾';
  }

  openBtn.addEventListener('click', openOverlay);
  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });
  bindInput(overlayInput, overlayResults);
  overlayInput.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeOverlay(); });

  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (overlay.classList.contains('open')) closeOverlay();
      else openOverlay();
    }
  });
})();
</script>
</body>
