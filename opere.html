<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenGadda — Opere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1814; --paper: #f5f0e8; --accent: #7a1a3a; --accent-light: #b0507a;
  --muted: #7a7268; --border: #c8bfaa; --white: #fdfaf5; --tag-bg: #f0dce4; --tag-text: #7a1a3a;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'EB Garamond',Georgia,serif; background:var(--paper); color:var(--ink); }
nav { background:var(--ink); border-bottom:2px solid var(--accent); display:flex; align-items:center; padding:0 2.5rem; gap:2rem; height:52px; position:sticky; top:0; z-index:100; }
.nav-brand { font-family:'DM Mono',monospace; font-size:13px; letter-spacing:0.18em; color:var(--white); text-decoration:none; margin-right:auto; }
nav a { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#9a9080; text-decoration:none; transition:color 0.2s; }
nav a:hover, nav a.active { color:#e8c89a; }

header { background:var(--ink); color:var(--white); padding:2.5rem 2.5rem 2rem; border-bottom:3px solid var(--accent); }
header .eyebrow { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#5a5248; margin-bottom:0.5rem; }
header h1 { font-size:2.4rem; font-weight:400; font-style:italic; margin-bottom:0.4rem; }
header p { color:#9a9080; font-size:1rem; }

.layout { display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 140px); }
.sidebar { background:var(--white); border-right:1px solid var(--border); padding:1.5rem 1.25rem; position:sticky; top:52px; height:calc(100vh - 52px); overflow-y:auto; }
.sidebar-section { margin-bottom:1.75rem; }
.sidebar-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin-bottom:0.6rem; display:block; }
.sidebar input[type=text] { width:100%; padding:0.5rem 0.6rem; font-family:'EB Garamond',serif; font-size:1rem; border:1px solid var(--border); background:var(--paper); color:var(--ink); border-radius:2px; outline:none; }
.sidebar input[type=text]:focus { border-color:var(--accent); }
.filter-group { display:flex; flex-direction:column; gap:3px; }
.filter-btn { text-align:left; background:none; border:none; padding:0.3rem 0.5rem; font-family:'EB Garamond',serif; font-size:0.9rem; color:var(--muted); cursor:pointer; border-radius:2px; display:flex; justify-content:space-between; align-items:center; transition:background 0.15s,color 0.15s; }
.filter-btn:hover { background:var(--tag-bg); color:var(--ink); }
.filter-btn.active { background:var(--accent); color:var(--white); }

.main { padding:1.5rem 2rem; }
.stats-bar { display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:3px; margin-bottom:1.25rem; overflow:hidden; }
.stat { background:var(--white); padding:0.75rem 1rem; text-align:center; }
.stat-n { font-family:'DM Mono',monospace; font-size:1.3rem; font-weight:500; color:var(--accent); display:block; }
.stat-l { font-size:0.8rem; color:var(--muted); }

.section-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0 0 0.6rem; display:block; }
.collections-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-bottom:0.6rem; }
.collection-card { background:var(--ink); color:var(--white); border-radius:4px; padding:0.9rem 1rem; cursor:pointer; border:2px solid transparent; transition:border-color 0.15s; display:flex; gap:0.85rem; }
.collection-card:hover { border-color:var(--accent-light); }
.collection-card.active { border-color:var(--accent-light); background:#2a1420; }
.collection-thumb { width:52px; height:78px; object-fit:cover; border-radius:2px; border:1px solid rgba(255,255,255,0.2); flex-shrink:0; }
.collection-card-body { min-width:0; flex:1; }
.collection-numero { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#e8c89a; margin-bottom:3px; }
.collection-title { font-size:1.05rem; font-style:italic; margin-bottom:2px; }
.collection-meta { font-family:'DM Mono',monospace; font-size:10px; color:#9a9080; margin-bottom:0.6rem; }
.collection-works { display:flex; flex-wrap:wrap; gap:4px; }
.collection-work-link { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.05em; padding:2px 7px; border-radius:2px; text-decoration:none; cursor:pointer; background:rgba(255,255,255,0.1); color:#e8c89a; border:1px solid rgba(255,255,255,0.15); }
.collection-work-link:hover { background:rgba(255,255,255,0.18); }
.collection-filter-banner { display:flex; align-items:center; justify-content:space-between; background:var(--tag-bg); border:1px solid var(--border); border-radius:3px; padding:0.5rem 1rem; margin-bottom:1.25rem; font-family:'DM Mono',monospace; font-size:11px; color:var(--tag-text); }
.collection-filter-banner button { background:none; border:none; cursor:pointer; color:var(--muted); font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.08em; }

.decade-header { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); padding:1.25rem 0.25rem 0.4rem; border-bottom:1px solid var(--border); margin-bottom:0.4rem; }
.decade-header:first-child { padding-top:0; }

.opera-card { border:1px solid var(--border); background:var(--white); border-radius:4px; padding:1.1rem 1.25rem; margin-bottom:0.9rem; display:flex; gap:1rem; }
.opera-thumb { width:64px; height:96px; object-fit:cover; border-radius:2px; border:1px solid var(--border); flex-shrink:0; }
.opera-card-body { min-width:0; flex:1; }
.opera-head { display:flex; align-items:baseline; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.3rem; }
.opera-title { font-size:1.25rem; font-weight:500; font-style:italic; color:var(--ink); cursor:pointer; }
.opera-title:hover { color:var(--accent); text-decoration:underline; }
.opera-sigla { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.08em; color:var(--accent); background:var(--tag-bg); padding:1px 7px; border-radius:2px; }
.opera-edition { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:0.55rem; }
.opera-blurb { font-size:0.98rem; line-height:1.5; color:var(--ink); margin-bottom:0.55rem; }
.opera-raccolta { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); margin-bottom:0.7rem; }
.opera-links { display:flex; flex-wrap:wrap; gap:6px; }
.opera-link { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.05em; padding:2px 8px; border-radius:2px; text-decoration:none; cursor:pointer; border:1px solid transparent; }
.opera-link .n { opacity:0.75; margin-left:3px; }
.opera-links-empty { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); font-style:italic; }

.no-results { text-align:center; padding:4rem 1rem; color:var(--muted); font-style:italic; font-size:1.1rem; }

.back-btn { display:inline-flex; align-items:center; gap:6px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); background:none; border:1px solid var(--border); border-radius:2px; padding:5px 12px; cursor:pointer; margin-bottom:1.25rem; transition:color 0.15s,border-color 0.15s; }
.back-btn:hover { color:var(--accent); border-color:var(--accent); }
.work-header { background:var(--ink); color:var(--white); border-radius:4px; padding:1.25rem 1.5rem; margin-bottom:1.25rem; display:flex; gap:1.25rem; }
.work-thumb { width:110px; height:165px; object-fit:cover; border-radius:3px; border:1px solid rgba(255,255,255,0.2); flex-shrink:0; }
.work-header-body { min-width:0; flex:1; }
.work-header .opera-title { color:var(--white); font-size:1.5rem; cursor:default; }
.work-header .opera-title:hover { text-decoration:none; }
.work-header .opera-edition { color:#9a9080; }
.work-header .opera-blurb { color:#d8d0c0; }
.work-header .opera-raccolta { color:#9a9080; margin-bottom:0; }

.cat-chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:1.25rem; }
.cat-chip { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:0.06em; padding:4px 11px; border-radius:20px; cursor:pointer; border:1px solid var(--border); background:var(--white); color:var(--muted); }
.cat-chip.active { background:var(--accent); border-color:var(--accent); color:var(--white); }
.cat-chip .n { opacity:0.7; margin-left:4px; }

.work-entry { border-bottom:1px solid var(--border); padding:0.85rem 0.25rem; display:grid; grid-template-columns:64px 1fr auto; gap:0.75rem; align-items:start; transition:background 0.15s; cursor:pointer; text-decoration:none; color:inherit; }
.work-entry:hover { background:var(--white); padding-left:0.5rem; padding-right:0.5rem; margin:0 -0.25rem; }
.work-entry-year { font-family:'DM Mono',monospace; font-size:11px; color:var(--accent); padding-top:3px; text-align:right; }
.work-entry-title { font-size:1rem; font-weight:500; line-height:1.3; color:var(--ink); margin-bottom:3px; }
.work-entry-sub { font-family:'DM Mono',monospace; font-size:10px; color:#9a9080; letter-spacing:0.04em; }
.work-entry-cat { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:0.08em; text-transform:uppercase; padding:2px 7px; border-radius:2px; white-space:nowrap; flex-shrink:0; }

@media(max-width:700px) { .layout { grid-template-columns:1fr; } .sidebar { position:static; height:auto; border-right:none; border-bottom:1px solid var(--border); } }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">OpenGadda</a>
  <a href="opere.html" class="active">Opere</a>
  <a href="archive.html">Archivi</a>
  <a href="primary_bibliography.html">Bib. primaria</a>
  <a href="secondary_bibliography.html">Bib. secondaria</a>
  <a href="library.html">Biblioteca</a>
  <a href="epistolario.html">Epistolario</a>
  <a href="translations.html">Traduzioni</a>
</nav>

<header>
  <div class="eyebrow">OpenGadda</div>
  <h1>Opere</h1>
  <p id="header-sub">Caricamento…</p>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <span class="sidebar-label">Ricerca</span>
      <input type="text" id="search" placeholder="Titolo…" oninput="applyFilters()">
    </div>
    <div class="sidebar-section">
      <span class="sidebar-label">Ordinamento</span>
      <div class="filter-group">
        <button class="filter-btn active" id="s-year" onclick="setSort('year')">Cronologico</button>
        <button class="filter-btn" id="s-title" onclick="setSort('title')">Alfabetico</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="view-list">
      <span class="section-label">Edizione critica — Garzanti, a cura di Dante Isella (1988–1993)</span>
      <div class="collections-grid" id="collections"></div>
      <div id="collection-filter-banner" class="collection-filter-banner" style="display:none">
        <span id="collection-filter-text"></span>
        <button onclick="setCollectionFilter(null)">× Mostra tutte le opere</button>
      </div>

      <span class="section-label">Tutte le opere</span>
      <div class="stats-bar">
        <div class="stat"><span class="stat-n" id="sn-shown">0</span><span class="stat-l">visualizzate</span></div>
        <div class="stat"><span class="stat-n" id="sn-items">0</span><span class="stat-l">schede collegate</span></div>
      </div>
      <div id="entries"><div style="padding:3rem 1rem;text-align:center;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)">Caricamento…</div></div>
    </div>

    <div id="view-work" style="display:none">
      <button class="back-btn" onclick="backToList()">← Tutte le opere</button>
      <div class="work-header" id="work-header"></div>
      <div class="cat-chip-row" id="work-cat-chips"></div>
      <div id="work-entries"></div>
    </div>
  </main>
</div>

<script>
// Individually-known pieces inside a collective sigla (e.g. SD = "Scritti
// dispersi", a miscellany) that are notable/well-known enough to deserve
// their own card, even though they don't have their own sigla in the
// official siglario. This is PURELY a display-layer grouping — matched by
// exact title text against items already correctly tagged with the
// parent sigla — and never gets written back into items.json or
// sigle_gadda.json. If the underlying data doesn't have a matching item,
// the card silently doesn't appear (no synthetic sigla is fabricated).
const SUB_WORKS = [
  {
    key: 'SD__norme_radiofonico', // internal only — DOM id / URL param, never a real sigla
    titolo_completo: 'Norme per la redazione di un testo radiofonico',
    edizione_originale: 'Torino, ERI, 1953 (pubblicato anonimo; poi Milano, Garzanti, a cura di D. Isella, 1991; poi Milano, Adelphi, a cura di M. Bricchi)',
    parentSigla: 'SD',
    matchTitle: 'Norme per la redazione di un testo radiofonico',
  },
];

const CAT_PAGES = {"library":"library.html","secondary bibliography":"secondary_bibliography.html","primary bibliography":"primary_bibliography.html","archive":"archive.html","letter":"epistolario.html","translation":"translations.html"};
const CAT_LABELS = {"library":"Biblioteca","secondary bibliography":"Bib. secondaria","primary bibliography":"Bib. primaria","archive":"Archivio","letter":"Epistolario","translation":"Traduzioni"};
const CAT_COLORS = {"library":"#7a3b1e","secondary bibliography":"#1e4a7a","primary bibliography":"#1a6a40","archive":"#6a3a1a","letter":"#5a1e7a","translation":"#6a5a1a"};
// archive/library/primary+secondary bibliography scope their OWN `?theme=`
// filter to the whole dataset (cross-category, by design — see e.g.
// archive.html's setThemeFilter). Their `?opera=` filter is the one that
// actually restricts results to just that page's own category, which is
// what a per-category badge count here should link to. translation/letter
// don't have that split — their `?theme=` is already category-scoped.
const CAT_FILTER_PARAM = {"library":"opera","secondary bibliography":"opera","primary bibliography":"opera","archive":"opera","letter":"theme","translation":"theme"};

// The five volumes of the Garzanti critical edition ("Opere di Carlo Emilio
// Gadda", collana "I Libri della Spiga", a cura di Dante Isella) that
// collect the individual works below. Membership is computed from each
// work's `raccolta` field in sigle_gadda.json (e.g. "RR I, pp. 3-107"), so
// this stays in sync automatically as that file is edited — nothing here
// needs updating when a work's raccolta changes.
const COLLECTIONS = [
  { id: 'RR I',   numero: 'Opere I',   titolo: 'Romanzi e racconti I',                       anno: 1988, isbn: '88-11-58640-2' },
  { id: 'RR II',  numero: 'Opere II',  titolo: 'Romanzi e racconti II',                      anno: 1989, isbn: '88-11-58641-0' },
  { id: 'SGF I',  numero: 'Opere III', titolo: 'Saggi, giornali, favole e altri scritti I',  anno: 1991, isbn: '88-11-58642-9' },
  { id: 'SGF II', numero: 'Opere IV',  titolo: 'Saggi, giornali, favole e altri scritti II', anno: 1992, isbn: '88-11-58643-7' },
  { id: 'SVP',    numero: 'Opere V',   titolo: 'Scritti vari e postumi',                     anno: 1993, isbn: '88-11-58644-5' },
];
const _RACCOLTA_RE = /^(RR I{1,2}|SGF I{1,2}|SVP)/;

let SIGLE = {};
let ALL_DATA = []; // raw items.json, kept so work-detail views can pull every matching entry
let OPERE = []; // [{sigla, titolo_completo, edizione_originale, raccolta, year, blurb, counts:{cat:n}, total}]
let filtered = [];
let sortKey = 'year';
let sortDir = 1;
let collectionFilter = null; // 'RR I' | 'RR II' | 'SGF I' | 'SGF II' | 'SVP' | null
let currentWork = null;      // sigla of the work whose detail view is open, or null
let workCatFilter = null;    // category filter within the open work's detail view

function extractYear(edizione) {
  if (!edizione) return null;
  const m = edizione.match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m ? parseInt(m[0]) : null;
}

function safeDomId(sigla) {
  return sigla.replace(/[^A-Za-z0-9]/g, '_');
}

// Cover images are a mix of .png and .jpg. Try .png first; if that 404s,
// fall back to .jpg; if that also fails, remove the <img> entirely (no
// broken-image icon) rather than hardcoding one extension.
function thumbImgTag(key, cssClass) {
  // Reassigning this.onerror to a new function *from inside the handler
  // that's currently running* doesn't reliably take effect for images
  // inserted via innerHTML (the next error event still fires the original
  // handler in some browsers) — so track fallback state with a data
  // attribute instead of swapping the handler itself.
  const base = 'img/' + encodeURIComponent(key);
  return `<img class="${cssClass}" src="${base}.png" data-fallback="${base}.jpg" alt="" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.dataset.fallback}else{this.remove()}">`;
}

// JSON.stringify() wraps in double quotes, which collides with onclick="..."
// (also double-quoted) — e.g. onclick="showWorkDetail(${JSON.stringify(x)})"
// renders as onclick="showWorkDetail("MdF")" and the attribute value is cut
// off at that first embedded quote. Some sigla also contain a literal
// apostrophe (e.g. "L'A"), so we can't just swap to single-quoted HTML
// attributes either. This builds a single-quoted JS string literal, safe to
// drop into a double-quoted HTML attribute regardless of the input.
function jsAttr(s) {
  if (s === null) return 'null';
  return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}

function collectionOf(raccolta) {
  return _RACCOLTA_RE.exec(raccolta || '')?.[1] || null;
}

function formatRaccolta(raccolta) {
  if (!raccolta) return '';
  const collId = collectionOf(raccolta);
  const coll = collId && COLLECTIONS.find(c => c.id === collId);
  return coll ? `${coll.numero} — ${raccolta}` : raccolta;
}

function setCollectionFilter(id) {
  collectionFilter = collectionFilter === id ? null : id;
  document.getElementById('search').value = '';
  renderCollections();
  const banner = document.getElementById('collection-filter-banner');
  if (collectionFilter) {
    const coll = COLLECTIONS.find(c => c.id === collectionFilter);
    banner.style.display = 'flex';
    document.getElementById('collection-filter-text').textContent = 'Solo opere in: ' + (coll ? `${coll.numero} — ${coll.titolo}` : collectionFilter);
  } else {
    banner.style.display = 'none';
  }
  applyFilters();
}

function renderCollections() {
  const html = COLLECTIONS.map(coll => {
    const members = Object.entries(SIGLE)
      .filter(([, meta]) => collectionOf(meta.raccolta) === coll.id)
      .sort((a,b) => alphaSortKey(a[1].titolo_completo).localeCompare(alphaSortKey(b[1].titolo_completo), 'it'));
    const workLinks = members.map(([sigla, meta]) =>
      `<span class="collection-work-link" title="${meta.titolo_completo.replace(/"/g,'&quot;')}" onclick="event.stopPropagation();showWorkDetail(${jsAttr(sigla)})">${sigla}</span>`
    ).join('');
    const active = collectionFilter === coll.id;
    const imgName = coll.numero.replace(/\s+/g, ''); // "Opere I" -> "OpereI.png"
    return `<div class="collection-card${active ? ' active' : ''}" onclick="setCollectionFilter(${jsAttr(coll.id)})">
      ${thumbImgTag(imgName, 'collection-thumb')}
      <div class="collection-card-body">
        <div class="collection-numero">${coll.numero}</div>
        <div class="collection-title">${coll.titolo}</div>
        <div class="collection-meta">Garzanti, ${coll.anno} · ISBN ${coll.isbn} · ${members.length} opere</div>
        <div class="collection-works">${workLinks}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('collections').innerHTML = html;
}

function alphaSortKey(name) {
  let s = (name || '').trim();
  let changed = true;
  while (changed) {
    changed = false;
    const noQuote = s.replace(/^[\s"'“”‘’«»″]+/, '');
    if (noQuote !== s) { s = noQuote; changed = true; }
    const noParen = s.replace(/^\([^)]*\)\s*/, '');
    if (noParen !== s) { s = noParen; changed = true; }
  }
  return s;
}

function doSort() {
  const SD = null;
  filtered.sort((a,b) => {
    if (sortKey === 'year') {
      if (a.year === SD && b.year === SD) return 0;
      if (a.year === SD) return 1;
      if (b.year === SD) return -1;
      return sortDir * (a.year - b.year);
    }
    return sortDir * alphaSortKey(a.titolo_completo).localeCompare(alphaSortKey(b.titolo_completo), 'it');
  });
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  ['year','title'].forEach(k => document.getElementById('s-'+k).classList.toggle('active', k === key));
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  filtered = OPERE.filter(o => {
    if (collectionFilter && collectionOf(o.raccolta) !== collectionFilter) return false;
    if (q && !(o.titolo_completo.toLowerCase().includes(q) || o.sigla.toLowerCase().includes(q))) return false;
    return true;
  });
  doSort();
  render();
}

function render() {
  document.getElementById('sn-shown').textContent = filtered.length;
  const totalLinked = filtered.reduce((s,o) => s + o.total, 0);
  document.getElementById('sn-items').textContent = totalLinked.toLocaleString('it');

  if (!filtered.length) {
    document.getElementById('entries').innerHTML = '<div class="no-results">Nessuna opera trovata.</div>';
    return;
  }

  const cardHtml = o => {
    const catEntries = Object.entries(o.counts).sort((a,b) => b[1]-a[1]);
    const links = catEntries.length
      ? catEntries.map(([cat, n]) => {
          const col = CAT_COLORS[cat] || '#888';
          const page = CAT_PAGES[cat] || 'index.html';
          const param = CAT_FILTER_PARAM[cat] || 'theme';
          return `<a class="opera-link" href="${page}?${param}=${encodeURIComponent(o.sigla)}" style="background:${col}18;color:${col};border-color:${col}40">${CAT_LABELS[cat]||cat}<span class="n">${n}</span></a>`;
        }).join('')
      : '<span class="opera-links-empty">Nessuna scheda collegata nel dataset</span>';
    const badgeSigla = o.displaySigla || o.sigla;
    const subWorkNote = o.isSubWork
      ? `<div class="opera-raccolta">Incluso in: <span style="cursor:pointer;text-decoration:underline" onclick="event.stopPropagation();showWorkDetail(${jsAttr(o.parentSigla)})">${(SIGLE[o.parentSigla]&&SIGLE[o.parentSigla].titolo_completo)||o.parentSigla} (${o.parentSigla})</span></div>`
      : '';
    return `<div class="opera-card" id="opera-${safeDomId(o.sigla)}">
      ${thumbImgTag(o.sigla, 'opera-thumb')}
      <div class="opera-card-body">
        <div class="opera-head">
          <span class="opera-title" onclick="showWorkDetail(${jsAttr(o.sigla)})">${o.titolo_completo}</span>
          <span class="opera-sigla">${badgeSigla}</span>
        </div>
        ${o.edizione_originale ? `<div class="opera-edition">${o.edizione_originale}</div>` : ''}
        ${subWorkNote || (o.raccolta ? `<div class="opera-raccolta">Edizione critica: ${formatRaccolta(o.raccolta)}</div>` : '')}
        <div class="opera-links">${links}</div>
      </div>
    </div>`;
  };

  // Just 35 works total — a flat sorted list reads better than splitting
  // into decade buckets. Undated works fall in wherever doSort() places
  // them (at the end, for the 'year' sort) without a separate section.
  document.getElementById('entries').innerHTML = filtered.map(cardHtml).join('');
}

// ── Work detail view — every entry across every category for one work ────────

function showWorkDetail(sigla) {
  currentWork = sigla;
  workCatFilter = null;
  document.getElementById('view-list').style.display = 'none';
  document.getElementById('view-work').style.display = '';
  history.pushState({work: sigla}, '', 'opere.html?work=' + encodeURIComponent(sigla));
  renderWorkDetail();
  window.scrollTo(0, 0);
}

function backToList() {
  currentWork = null;
  document.getElementById('view-list').style.display = '';
  document.getElementById('view-work').style.display = 'none';
  history.pushState(null, '', 'opere.html');
}

function setWorkCatFilter(cat) {
  workCatFilter = workCatFilter === cat ? null : cat;
  renderWorkDetail();
}

function renderWorkDetail() {
  const sigla = currentWork;
  const work = OPERE.find(o => o.sigla === sigla);
  const meta = SIGLE[sigla] || {};
  const titolo = work ? work.titolo_completo : (meta.titolo_completo || sigla);
  const edizione = work ? work.edizione_originale : (meta.edizione_originale || '');
  const raccolta = work ? work.raccolta : (meta.raccolta || '');
  const badgeSigla = (work && work.displaySigla) || sigla;

  const allEntries = (work && work.isSubWork)
    ? ALL_DATA.filter(d => d.title === work.matchTitle && (d.themes||[]).includes(work.parentSigla))
    : ALL_DATA.filter(d => (d.themes || []).includes(sigla));

  const subWorkNote = (work && work.isSubWork)
    ? `<div class="opera-raccolta">Incluso in: <span style="cursor:pointer;text-decoration:underline;color:inherit" onclick="showWorkDetail(${jsAttr(work.parentSigla)})">${(SIGLE[work.parentSigla]&&SIGLE[work.parentSigla].titolo_completo)||work.parentSigla} (${work.parentSigla})</span></div>`
    : (raccolta ? `<div class="opera-raccolta">Edizione critica: ${formatRaccolta(raccolta)}</div>` : '');

  document.getElementById('work-header').innerHTML = `
    ${thumbImgTag(sigla, 'work-thumb')}
    <div class="work-header-body">
      <div class="opera-head">
        <span class="opera-title">${titolo}</span>
        <span class="opera-sigla" style="background:rgba(255,255,255,0.15);color:#e8c89a">${badgeSigla}</span>
      </div>
      ${edizione ? `<div class="opera-edition">${edizione}</div>` : ''}
      ${subWorkNote}
    </div>
  `;

  const catCounts = {};
  allEntries.forEach(d => { catCounts[d.category] = (catCounts[d.category] || 0) + 1; });
  const catEntries = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
  const chips = [`<span class="cat-chip${!workCatFilter ? ' active' : ''}" onclick="setWorkCatFilter(null)">Tutte<span class="n">${allEntries.length}</span></span>`]
    .concat(catEntries.map(([cat,n]) =>
      `<span class="cat-chip${workCatFilter===cat ? ' active' : ''}" onclick="setWorkCatFilter(${jsAttr(cat)})">${CAT_LABELS[cat]||cat}<span class="n">${n}</span></span>`
    ));
  document.getElementById('work-cat-chips').innerHTML = chips.join('');

  const shown = (workCatFilter ? allEntries.filter(d => d.category === workCatFilter) : allEntries).slice();
  // Undated entries (date === null) sort last rather than being miscast as
  // 1970-01-01 by `new Date(null)`.
  shown.sort((a,b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return new Date(a.date) - new Date(b.date);
  });

  if (!shown.length) {
    document.getElementById('work-entries').innerHTML = '<div class="no-results">Nessuna scheda collegata nel dataset.</div>';
    return;
  }

  document.getElementById('work-entries').innerHTML = shown.map(d => {
    const col = CAT_COLORS[d.category] || '#888';
    const sub = [d.subtitle, d.detail].filter(Boolean).join(' · ');
    return `<a class="work-entry" href="detail.html?id=${d.id}">
      <div class="work-entry-year">${d.year !== null ? d.year : 's.d.'}</div>
      <div>
        <div class="work-entry-title">${(d.title||'').replace(/\n/g,' ')}</div>
        ${sub ? `<div class="work-entry-sub">${sub}</div>` : ''}
      </div>
      <span class="work-entry-cat" style="background:${col}18;color:${col};border:1px solid ${col}40">${CAT_LABELS[d.category]||d.category}</span>
    </a>`;
  }).join('');
}

window.addEventListener('popstate', function(e) {
  if (e.state && e.state.work) {
    currentWork = e.state.work;
    workCatFilter = null;
    document.getElementById('view-list').style.display = 'none';
    document.getElementById('view-work').style.display = '';
    renderWorkDetail();
  } else {
    currentWork = null;
    document.getElementById('view-list').style.display = '';
    document.getElementById('view-work').style.display = 'none';
  }
});

Promise.all([
  fetch('items.json').then(r => r.json()),
  fetch('sigle_gadda.json').then(r => r.json())
]).then(([allData, sigleData]) => {
  SIGLE = sigleData.sigle || {};
  ALL_DATA = allData;

  const counts = {};
  allData.forEach(it => {
    (it.themes || []).forEach(t => {
      if (!SIGLE[t]) return;
      if (!counts[t]) counts[t] = {};
      counts[t][it.category] = (counts[t][it.category] || 0) + 1;
    });
  });

  OPERE = Object.entries(SIGLE).map(([sigla, meta]) => {
    const catCounts = counts[sigla] || {};
    const total = Object.values(catCounts).reduce((s,n) => s+n, 0);
    return {
      sigla,
      titolo_completo: meta.titolo_completo || sigla,
      edizione_originale: meta.edizione_originale || '',
      raccolta: meta.raccolta || '',
      year: extractYear(meta.edizione_originale),
      counts: catCounts,
      total,
    };
  });

  // Sub-works: only added when a real matching item exists — never
  // fabricated. Inherits the parent sigla's raccolta so it still shows up
  // correctly under the right "Opere I–V" collection filter.
  SUB_WORKS.forEach(sw => {
    const matches = allData.filter(it => it.title === sw.matchTitle && (it.themes||[]).includes(sw.parentSigla));
    if (!matches.length) return;
    const catCounts = {};
    matches.forEach(it => { catCounts[it.category] = (catCounts[it.category]||0) + 1; });
    const parentMeta = SIGLE[sw.parentSigla] || {};
    OPERE.push({
      sigla: sw.key,
      displaySigla: sw.parentSigla,
      isSubWork: true,
      parentSigla: sw.parentSigla,
      matchTitle: sw.matchTitle,
      titolo_completo: sw.titolo_completo,
      edizione_originale: sw.edizione_originale || '',
      raccolta: parentMeta.raccolta || '',
      year: extractYear(sw.edizione_originale),
      counts: catCounts,
      total: matches.length,
    });
  });

  const totalLinked = OPERE.reduce((s,o) => s + o.total, 0);
  document.getElementById('header-sub').textContent =
    `${totalLinked.toLocaleString('it')} schede collegate nel dataset`;

  renderCollections();
  applyFilters();

  const urlP = new URLSearchParams(window.location.search);
  if (urlP.get('work')) showWorkDetail(decodeURIComponent(urlP.get('work')));
}).catch(err => {
  console.error('Errore caricamento dati:', err);
  document.getElementById('entries').innerHTML = '<p style="padding:2rem;color:#c00;font-family:monospace">Errore: ' + err + '</p>';
});
</script>
