      const above = reduce(aboveGroups), below = reduce(belowGroups);
      window.__rowCrossings = { mode: "crossings", before, after: sideCrossings(above) + sideCrossings(below), rows: list.length };
      return [...above].reverse().concat([gadda], below);
    }
    const people = layoutRows(byBarycenter, null, d => (d.interactions && d.interactions.length ? clusterInteractions(d.interactions).map(c => [c[0], c[c.length - 1]]) : []));

    // in dense views (Show all) the rows nearest Gadda would sit inside the
    // width of his line and its clearance, with no room left to dip, so they'd
    // lie flat against it. Leave as many empty rows on each side of him as it
    // takes to keep NEAR_ROOM units free: half his line (5) + air (2) + half
    // the thickest line with its halo (5) + room to dip (6). In sparse views
    // (Most active) rows are already further apart and no empty row is added.
    // (at least 30 screen pixels, so it still shows when Show all shrinks the graph)
    const NEAR_ROOM = Math.max(18, 30 * unitsPerPx);
    let nearSpacers = 0;
    for (let i = 0; i < 3; i++) {
      const step = (height - margin.bottom - margin.top) / (people.length + 2 * nearSpacers + 1);
      nearSpacers = Math.max(0, Math.ceil(NEAR_ROOM / step) - 1);
    }
    const yScale = d3.scalePoint()
      .domain(people.flatMap(d => (d.name === "Gadda Carlo Emilio"
        ? [...d3.range(nearSpacers).map(i => `__above${i}`), d.name, ...d3.range(nearSpacers).map(i => `__below${i}`)]
        : [d.name])))
      .range([margin.top, height - margin.bottom])
      .padding(1);
    const y = name => yScale(name);
    const gaddaY = y("Gadda Carlo Emilio");
    // dip depth ceiling, scaled to the actual row spacing — a fixed value
    // only looks right at the one row spacing it was tuned for. Scale it up
    // and every dip shrinks to a barely-visible wiggle relative to how far
    // the row actually is from Gadda; scale it down and multiple dips crowd
    // onto nearly the same height near gaddaY, reading as parallel to each
    // other instead of each reaching toward him.
    const rowStep = Math.abs(yScale.step()) || 30;
    const maxGap = Math.min(rowStep * 0.4, rowStep / 2 - 2);

    const correspondentNames = people.filter(d => d.name !== "Gadda Carlo Emilio").map(d => d.name);
    const colorMap = new Map();
    people.forEach(d => { if (d.name !== "Gadda Carlo Emilio") colorMap.set(d.name, genreColors[genreFor[d.name]] || genreColors["Varia"]); });
    const colorScale = name => colorMap.get(name);
    const gaddaColor = "var(--ink)";
    const colorFor = name => (name === "Gadda Carlo Emilio" ? gaddaColor : colorScale(name));

    // the life line's color and thickness both track interaction strength:
    // each correspondent keeps their own distinct hue (so lines stay
    // individually identifiable), but a stronger tie darkens/saturates that
    // hue and draws a thicker line, while a weaker one lightens and thins it.
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const minStrokeWidth = 2, maxStrokeWidth = 7;
    const haloExtra = 3;
    function strengthFor(d) {
      return d.name === "Gadda Carlo Emilio" ? 1 : rescaleWeight(d.weight ?? 1);
    }
    // clamp lightness in HCL space rather than using .darker()/.brighter()
    // directly — those have no floor/ceiling, so a weak tie's base shade
    // could get lightened almost to white and vanish against the page
    // background, leaving only the birth/death dots visible (which use the
    // unshaded color) and making the line look like two disconnected points.
    const minL = 25, maxL = 75;
    function shadeFor(d) {
      if (d.name === "Gadda Carlo Emilio") return gaddaColor;
      const hcl = d3.hcl(colorFor(d.name));
      hcl.l = maxL - strengthFor(d) * (maxL - minL);
      // keep a minimum colourfulness: the pale end of the palette would
      // otherwise darken to near-grey and stop reading as this reparto's hue
      hcl.c = Math.max(hcl.c, 50);
      return hcl.formatHex();
    }
    // Gadda's own line is the spine of the graph: thicker than any other
    // line and fully opaque (see .gadda-life), so it always stands out
    const GADDA_WIDTH = 10;
    function strokeWidthFor(d) {
      if (d.name === "Gadda Carlo Emilio") return Math.max(GADDA_WIDTH, 3 * unitsPerPx);   // at least 3 px on screen
      return minStrokeWidth + (maxStrokeWidth - minStrokeWidth) * strengthFor(d);
    }

    svg.append("line")
      .attr("class", "time-baseline")
      .attr("x1", margin.left).attr("x2", width - margin.right)
      .attr("y1", margin.top).attr("y2", margin.top);

    svg.append("g")
      .selectAll("text")
      // about one year label per 110px on screen, so zooming in adds labels
      .data(x.ticks(Math.max(10, Math.round(width / unitsPerPx / 110))))
      .join("text")
        .attr("class", "time-label")
        .attr("x", d => x(d))
        .attr("y", margin.top - 10)
        .attr("text-anchor", "middle")
        .text(d3.format("d"));

    // where a line goes while it's in contact with Gadda — two styles,
    // picked in the sidebar ("Dips"):
    //   "close": right up to Gadda's line, with just DIP_AIR of air so they
    //            never sit on it; stronger ties come closer (depth tiers)
    //   "lanes": every person has their own lane beside Gadda's line —
    //            inner rows inner lanes — so lines in contact at the same
    //            time run side by side instead of on top of each other
    // Either way a dip never goes past the person's own row.
    const DIP_AIR = 2;
    const rowIndex = new Map(people.map((p, i) => [p.name, i]));
    const gaddaIndex = rowIndex.get("Gadda Carlo Emilio");
    const laneWidth = Math.min(maxStrokeWidth + DIP_AIR, rowStep * 0.9);
    function dipYFor(d) {
      const rowY = y(d.name);
      const direction = rowY < gaddaY ? 1 : -1;
      const distance = Math.abs(rowY - gaddaY);
      // air and tier band have a minimum size on SCREEN (3 px / 12 px), so in
      // dense, shrunk views lines still stop visibly short of Gadda's line
      // and their strength tiers stay distinguishable
      const air = Math.max(DIP_AIR, 3 * unitsPerPx);
      const tierBand = Math.max(maxGap, 12 * unitsPerPx);
      const gaddaEdge = strokeWidthFor(gadda) / 2 + air;
      let offset;
      if (dipStyle === "lanes") {
        const lane = Math.abs(rowIndex.get(d.name) - gaddaIndex) - 1;   // 0 = nearest row
        offset = gaddaEdge + laneWidth * (lane + 0.5);
      } else {
        const w = quantizeToTier(rescaleWeight(d.weight ?? 1));
        offset = gaddaEdge + (strokeWidthFor(d) + haloExtra) / 2 + tierBand * (1 - w);
      }
      return gaddaY - direction * Math.min(offset, distance);
    }

    people.forEach(d => {
      d.frameBirth = d.birth;
      // capped at Gadda's own death — a correspondent who outlived him keeps
      // their line ending there too, not stretching into their own later life.
      d.frameDeath = Math.min(d.death, gadda.death);
      // true only for someone who actually died before Gadda did — their line
      // already ends at that earlier, distinctive point rather than the
      // shared boundary everyone else's line now converges on.
      d.diedBeforeGadda = d.death < gadda.death;
    });

    // remembers each line's flat stretches (its own row, or the flat bottom
    // of a dip), so the name can be placed ON the line — see pinLabels below
    const lineShapes = new Map();
    function shapePath(d, pts, curved) {
      const segs = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        if (Math.abs(y0 - y1) > 1e-6 || x1 <= x0) continue;
        const last = segs[segs.length - 1];
        if (last && Math.abs(last.x1 - x0) < 1e-6 && Math.abs(last.y - y0) < 1e-6) last.x1 = x1;
        else segs.push({ x0, x1, y: y0 });
      }
      lineShapes.set(d.name, segs);
      return curved ? d3.line().curve(d3.curveMonotoneX)(pts) : d3.line()(pts);
    }

    function lifePath(d) {
      const rowY = y(d.name);
      if (!d.interactions || d.interactions.length === 0) {
        return shapePath(d, [[x(d.frameBirth), rowY], [x(d.frameDeath), rowY]], false);
      }
      const dipY = dipYFor(d);
      const clusters = clusterInteractions(d.interactions);
      // the drawn line spans birth to death, widened to also cover any
      // interaction years that fall outside that window — nothing gets
      // silently dropped just because it's earlier than the biological
      // lifespan on record. The end never goes past Gadda's own death though.
      const lineStart = Math.min(d.frameBirth, d.interactions[0]);
      const lineEnd = d.frameDeath;
      const points = [[x(lineStart), rowY]];
      clusters.forEach(cluster => {
        const first = cluster[0];
        const last = cluster[cluster.length - 1];
        points.push([x(Math.max(lineStart, first - reach)), rowY]);
        cluster.forEach(yr => points.push([x(yr), dipY]));
        points.push([x(Math.min(lineEnd, last + reach)), rowY]);
      });
      points.push([x(lineEnd), rowY]);
      return shapePath(d, points, true);
    }

    const rows = svg.selectAll(".row").data(people).join("g").attr("class", "row");

    rows.append("path")
      .attr("class", "life-halo")
      .attr("stroke-width", d => strokeWidthFor(d) + haloExtra)
      .attr("d", lifePath);
    rows.append("path")
      .attr("class", d => (d.name === "Gadda Carlo Emilio" ? "life gadda-life" : "life"))
      .attr("stroke", shadeFor)
      .attr("stroke-width", strokeWidthFor)
      .attr("d", lifePath);

    rows.append("circle")
      .attr("class", "pt")
      .attr("fill", d => colorFor(d.name))
      .attr("cx", d => x(d.frameBirth))
      .attr("cy", d => y(d.name))
      .attr("r", 4);

    const lineLabels = rows.append("text")
      .attr("class", "line-label")
      .attr("fill", d => colorFor(d.name))
      // clamped to the visible frame's left edge — when a time focus is
      // active and this person's real birth falls before it, anchoring the
      // label to the true (off-screen) birth year would push it past the
      // canvas edge and make it vanish, even though their line still
      // correctly draws and clips within the focused window.
      .attr("x", d => Math.max(x(d.frameBirth), margin.left) + 8)
      .attr("y", d => y(d.name) - 6)
      .style("cursor", "pointer")
      .text(d => d.name);

    // focus mode: names sit ON their own line. While you scroll, each name
    // stays at the window's left edge, on the first flat stretch of its line
    // (its own row, or the flat bottom of a dip) that's long enough to hold
    // it — so names don't pile up where lines curve into Gadda's. Once a
    // line has ended, its name rests at the line's end. A background-coloured
    // outline makes the line break around the text. Labels are drawn in one
    // layer on top, so no other line crosses them.
    const labelLayer = svg.append("g").attr("class", "label-layer");
    // label size follows the row spacing so neighbouring names never touch
    const labelPx = Math.max(8, Math.min(12, (Math.abs(yScale.step()) / unitsPerPx) * 0.8));
    svg.style("--label-size", (labelPx * unitsPerPx) + "px");
    // the year axis gets the same treatment: a constant on-screen size
    svg.style("--axis-size", (11 * unitsPerPx) + "px");
    lineLabels
      .each(function () { labelLayer.node().appendChild(this); })
      .attr("text-anchor", "start")
      .attr("dominant-baseline", "middle")
      .attr("paint-order", "stroke")
      .attr("stroke", "var(--bg)")
      .attr("stroke-width", 4 * unitsPerPx)
      .attr("stroke-linejoin", "round")
      // clicks on a row normally come from the row group, which the label
      // has just left, so forward them to it
      .on("click", (event, d) => rows.filter(r => r.name === d.name).dispatch("click"));
    // very light line colours are darkened for the names, so every name
    // stays readable against the background (Gadda's own ink is left as is)
    lineLabels.attr("fill", function () {
      const fill = this.getAttribute("fill");
      const c = d3.hcl(fill);
      if (isNaN(c.l)) return fill;
      c.l = Math.min(c.l, 45);
      return c.formatHex();
    });
    // a background box behind each name (an outline alone leaves the line
    // showing through the spaces between words)
    const labelBoxH = labelPx * 1.35 * unitsPerPx;
    // connections to other graphs: one small dot per other reparto this
    // person also appears in, in that reparto's colour
    lineLabels.each(function (d) {
      otherReparti(d.name).forEach((k, i) => {
        d3.select(this).append("tspan")
          .attr("class", "xref-dot")
          .attr("fill", repartoAccents[k])
          .attr("dx", (i ? 1 : 4) * unitsPerPx)
          .text("●");
      });
    });
    lineLabels.each(function (d) {
      const also = otherReparti(d.name).map(k => repartoLabels[k]);
      d3.select(this).append("title").text(d.name + (also.length ? `\nAlso in: ${also.join(", ")}` : ""));
      this.__w = this.getComputedTextLength();
      this.__box = labelLayer.insert("rect", () => this)
        .attr("class", "label-bg")
        .attr("width", this.__w + 6 * unitsPerPx)
        .attr("height", labelBoxH)
        .attr("rx", 2 * unitsPerPx)
        .node();
    });
    pinLabels = () => {
      const pad = 6 * unitsPerPx;
      const startGap = 2 * pad; // clear of the birth dot at the line's start
      const leftEdge = Math.max(margin.left, window.scrollX * unitsPerPx) + pad;
      lineLabels.each(function (d) {
        const segs = lineShapes.get(d.name) || [];
        this.__spot = null;
        if (!segs.length) return;
        const need = this.__w + 2 * pad;
        // names only ever sit on the person's own row — never on the bottom
        // of a dip, which runs right next to Gadda's line where many lines
        // (and names) would meet. If the line is dipping at the window's
        // edge, the name waits just after the dip, where it comes back.
        const rowY = y(d.name);
        const rowSegs = segs.filter(s => Math.abs(s.y - rowY) < 1e-6);
        const pool = rowSegs.length ? rowSegs : segs;
        const seg = pool.find(s => s.x1 - Math.max(s.x0 + startGap, leftEdge) >= need);
        let spot;
        if (seg) spot = { x: Math.max(seg.x0 + startGap, leftEdge), y: seg.y };
        else {
          // the line has no room left ahead: the name rests where it ended
          const last = pool[pool.length - 1];
          spot = { x: Math.max(last.x0 + startGap, last.x1 - need), y: last.y };
        }
        this.setAttribute("x", spot.x);
        this.setAttribute("y", spot.y);
        this.__box.setAttribute("x", spot.x - 3 * unitsPerPx);
        this.__box.setAttribute("y", spot.y - labelBoxH / 2);
        this.__spot = spot;
      });
      // no two names may overlap: Gadda's always shows, then the stronger
      // tie wins; a hidden name comes back as soon as it has room again
      const priority = n => (n.__data__.name === "Gadda Carlo Emilio" ? Infinity : (n.__data__.weight ?? 0));
      const kept = [];
      lineLabels.nodes().slice().sort((a, b) => priority(b) - priority(a)).forEach(n => {
        if (!n.__spot) return;
        const box = {
          x0: n.__spot.x - 3 * unitsPerPx, x1: n.__spot.x + n.__w + 3 * unitsPerPx,
          y0: n.__spot.y - labelBoxH / 2, y1: n.__spot.y + labelBoxH / 2,
        };
        const clash = kept.some(k => box.x0 < k.x1 && box.x1 > k.x0 && box.y0 < k.y1 && box.y1 > k.y0);
        n.setAttribute("visibility", clash ? "hidden" : "visible");
        n.__box.setAttribute("visibility", clash ? "hidden" : "visible");
        if (!clash) kept.push(box);
      });
    };
    pinLabels();
    const shownNames = new Set(shownCorrespondents.map(d => d.name));
    updateReadout = () => {
      const graphW = window.innerWidth - document.getElementById("side-panel").offsetWidth;
      const lo = Math.round(Math.max(yearMin, x.invert(Math.max(margin.left, window.scrollX * unitsPerPx))));
      const hi = Math.round(Math.min(yearMax, x.invert((window.scrollX + graphW) * unitsPerPx)));
      let people = 0, drawn = 0;
      const totals = contactKinds.map(() => 0);
      eligible.forEach(d => {
        const c = contactsIn(d, lo, hi);
        if (c.active) { people++; if (shownNames.has(d.name)) drawn++; }
        c.counts.forEach((n, i) => totals[i] += n);
      });
      readout.html(
        `<div class="ro-years">${lo} – ${hi} on screen</div>` +
        `<div><strong>${people}</strong> ${people === 1 ? "person" : "people"} in contact` +
        (drawn < people ? ` <span class="ro-sub">(${drawn} drawn)</span>` : "") + `</div>` +
        contactKinds.map((k, i) => `<div><strong>${totals[i]}</strong> ${k.noun}</div>`).join("")
      );
    };
    updateReadout();

    // an × marks anyone who died before Gadda — their line ends at that
    // real, earlier point, not at the shared boundary, so it's worth calling
    // out. Nobody else gets a right-end marker: their line stops at Gadda's
    // own death only because the frame does, not because of anything
    // specific to them, so a marker there would be redundant.
    svg.selectAll(".cutoff")
      .data(people.filter(d => d.diedBeforeGadda))
      .join("text")
        .attr("class", "cutoff")
        .attr("fill", d => colorFor(d.name))
        .attr("x", d => x(d.frameDeath))
        .attr("y", d => y(d.name))
        .attr("text-anchor", "middle")
        .attr("dominant-baseline", "central")
        .text("×");

    // one contact per CLUSTER of nearby years (same gapLimit=5 rule the line
    // itself already dips through), not one per individual year — with 8-14
    // book years for some people, a marker per year was crowding into an
    // unreadable pile of tiny pills. Years within 5 of each other now share
    // a single wider range-envelope, same as how the "-range" files show one
    // continuous span instead of a mark per data point.
    const contacts = people.flatMap(d =>
      d.interactions && d.interactions.length
        ? clusterInteractions(d.interactions).map(cluster => ({
            yearStart: cluster[0],
            yearEnd: cluster[cluster.length - 1],
            years: cluster,
            dipY: dipYFor(d),
            color: colorFor(d.name),
            name: d.name,
          }))
        : []
    );
    const contactG = svg.selectAll(".contact")
      .data(contacts)
      .join("g")
        .attr("class", "contact")
        .style("cursor", "pointer");

    const pillWidth = 8;
    contactG.append("rect")
      .attr("class", "contact-envelope")
      .attr("stroke", d => d.color)
      .attr("x", d => x(d.yearStart) - pillWidth / 2)
      .attr("y", d => Math.min(d.dipY, gaddaY) - 4)
      .attr("width", d => (x(d.yearEnd) - x(d.yearStart)) + pillWidth)
      .attr("height", d => Math.abs(gaddaY - d.dipY) + 8)
      .attr("rx", pillWidth / 2);

    // one small marker PER ACTUAL YEAR inside each range-envelope — the
    // envelope merges nearby years for a clean, uncluttered dip shape, but
    // hovering should still land on one specific record, not the whole
    // merged range. Each mark keeps a reference back to its cluster so
    // selection/visibility can follow the cluster it belongs to.
    const yearMarks = contacts.flatMap(c =>
      c.years.map(year => ({ year, dipY: c.dipY, color: c.color, name: c.name, cluster: c }))
    );
    const yearMarkG = svg.selectAll(".year-mark")
      .data(yearMarks)
      .join("g")
        .attr("class", "year-mark")
        .style("cursor", "pointer");

    yearMarkG.append("circle")
      .attr("class", "contact-pt")
      .attr("fill", d => d.color)
      .attr("cx", d => x(d.year))
      .attr("cy", d => d.dipY)
      .attr("r", 3);

    yearMarkG.append("rect")
      .attr("class", "contact-pt contact-pt-gadda")
      .attr("stroke", d => d.color)
      .attr("x", d => x(d.year) - 3)
      .attr("y", gaddaY - 3)
      .attr("width", 6)
      .attr("height", 6)
      .attr("transform", d => `rotate(45 ${x(d.year)} ${gaddaY})`);

    // a set, not a single name — picking several people from search should
    // highlight all of them together, not just whichever was picked last.
    // Clicking a row directly still isolates to just that one person (see
    // toggleSelection below), same as before.
    let selected = new Set(initialSelected);
    let selectedContact = null;

    function isRelevant(name) {
      if (selectedContact) return name === "Gadda Carlo Emilio" || name === selectedContact.name;
      return selected.size === 0 || name === "Gadda Carlo Emilio" || selected.has(name);
    }

    // true while a hover preview is drawn — previews only change the
    // highlighting, never the real selection, the scroll or the sidebar
    let previewing = false;
    // the earliest year of contact with Gadda for a person, within the
    // years drawn (same behaviour as the letters graph): their first dated
    // record here, or the start of their known span when there is none
    function firstContactYear(name) {
      const p = people.find(q => q.name === name);
      if (!p) return null;
      const years = [...contactKinds.flatMap(k => k.yearsOf(name)), ...(p.interactions || [])]
        .filter(yr => Number.isFinite(yr) && yr >= yearMin && yr <= yearMax);
      if (years.length) return Math.min(...years);
      return p.range_start != null ? Math.min(yearMax, Math.max(yearMin, p.range_start)) : null;
    }
    function scrollToFirstContact(names) {
      const years = names.map(firstContactYear).filter(yr => yr != null);
      if (!years.length) return;
      // leave a little room before the first contact so the approach shows
      const left = x(Math.min(...years)) / unitsPerPx - 140;
      window.scrollTo({ left: Math.max(0, left), behavior: "smooth" });
    }

    function applyHighlight() {
      if (!previewing) {
        // a newly selected person (clicked, searched, or arriving from
        // another graph) brings the view to their first contact with Gadda
        const newlySelected = [...selected].filter(n => !lastSelectedNames.includes(n) && n !== "Gadda Carlo Emilio");
        if (newlySelected.length) scrollToFirstContact(newlySelected);
        lastSelectedNames = [...selected];
        updateCrossLinks(lastSelectedNames);
      }
      rows.selectAll(".life, .life-halo").style("opacity", d => (isRelevant(d.name) ? null : 0.08));
      rows.selectAll(".pt").style("opacity", d => (isRelevant(d.name) ? 1 : 0.08));
      svg.selectAll(".contact").each(function (d) {
        const visible = selectedContact ? d === selectedContact : selected.has(d.name);
        // opacity alone isn't enough — a hidden contact still intercepts
        // hover/click by default, and if another person's contact happens
        // to land at the same pixel (same year, similar dip depth) and sits
        // later in the DOM, it silently steals the hover from the one
        // that's actually visible underneath. Disabling pointer-events on
        // hidden contacts lets the mouse pass through to the real target.
        d3.select(this)
          .style("opacity", visible ? 1 : 0)
          .style("pointer-events", visible ? null : "none");
      });
      svg.selectAll(".year-mark").each(function (d) {
        const visible = selectedContact ? d.cluster === selectedContact : selected.has(d.name);
        d3.select(this)
          .style("opacity", visible ? 1 : 0)
          .style("pointer-events", visible ? null : "none");
      });
      lineLabels.style("font-weight", d => (selected.has(d.name) ? 800 : 600));

      svg.select(".compare-link").remove();
      svg.select(".compare-label").remove();
      if (selectedContact) {
        const cx = (x(selectedContact.yearStart) + x(selectedContact.yearEnd)) / 2;
        svg.append("line")
          .attr("class", "compare-link")
          .attr("stroke", selectedContact.color)
          .attr("x1", cx).attr("x2", cx)
          .attr("y1", selectedContact.dipY).attr("y2", gaddaY);
        const yearLabel = selectedContact.yearStart === selectedContact.yearEnd
          ? `${selectedContact.yearStart}`
          : `${selectedContact.yearStart}–${selectedContact.yearEnd}`;
        svg.append("text")
          .attr("class", "compare-label")
          .attr("x", cx)
          .attr("y", Math.min(selectedContact.dipY, gaddaY) - 8)
          .attr("text-anchor", "middle")
          .attr("fill", selectedContact.color)
          .text(`${selectedContact.name} — ${yearLabel}`);
      }

      // cross-graph link: any selected person who also has real letter
      // correspondence with Gadda (their record's primary reparto is
      // "library", so they aren't among that graph's default correspondents
      // — this is the only way to reach them there) gets a link. Lists one
      // line per such person if more than one is selected.
      const crossLinkEl = d3.select("#cross-link");
      const linked = [...selected].map(name => people.find(p => p.name === name)).filter(p => p && p.letterLink);
      if (linked.length) {
        crossLinkEl
          .attr("hidden", null)
          .html(linked.map(p =>
            `${p.name} also has letter correspondence with Gadda — <a href="gadda-reparto-letter-range-declutter.html?focus=${encodeURIComponent(p.name)}" target="_blank">view in the Letters graph →</a>`
          ).join("<br>"));
      } else {
        crossLinkEl.attr("hidden", true);
      }
    }

    function toggleSelection(name) {
      selectedContact = null;
      if (name === "Gadda Carlo Emilio" || (selected.size === 1 && selected.has(name))) {
        selected = new Set();
      } else {
        selected = new Set([name]);
      }
      applyHighlight();
    }
    function toggleContact(contact) {
      selected = new Set();
      selectedContact = selectedContact === contact ? null : contact;
      applyHighlight();
    }

    rows.style("cursor", "pointer").on("click", (event, d) => toggleSelection(d.name));
    contactG.on("click", (event, d) => {
      event.stopPropagation();
      if (!selected.has(d.name) && d !== selectedContact) return;
      toggleContact(d);
    });

    // hover declutter: a broad filter can put dozens of lines on screen at
    // once, which is fine to scan for shape but hard to read any ONE person
    // out of. Rather than requiring a click (which commits to a selection),
    // hovering any row previews the same isolation effect instantly, and
    // reverts the moment the mouse leaves — as long as nothing is already
    // click-selected, so this never fights an intentional selection.
    function previewHighlight(name) {
      const real = selected;
      selected = new Set([name]);
      previewing = true;
      applyHighlight();
      previewing = false;
      selected = real; // restore the actual selection for the next call
    }
    // the preview waits until the pointer rests on a line for HOVER_DELAY ms,
    // and never fires while the page is scrolling — so scrolling across the
    // graph doesn't light up every line it passes
    const HOVER_DELAY = 350;
    let hoverTimer = null;
    rows
      .on("mouseenter", (event, d) => {
        if (d.name === "Gadda Carlo Emilio" || selected.size > 0) return;
        clearTimeout(hoverTimer);
        hoverTimer = setTimeout(() => {
          if (selected.size > 0 || Date.now() - lastScrollAt < HOVER_DELAY) return;
          previewHighlight(d.name);
        }, HOVER_DELAY);
      })
      .on("mouseleave", () => {
        clearTimeout(hoverTimer);
        if (selected.size > 0) return;
        applyHighlight();
      });

    // hover tooltip: the one specific book (or books) this person actually
    // published in THIS exact year — not the whole range-envelope's worth.
    // The envelope merges nearby years so the dip shape stays clean, but the
    // tooltip must still point at one precise record, hence it's attached to
    // the individual year-marks (yearMarkG) rather than the cluster group.
    const tooltip = d3.select("#tooltip");
    function moveTooltip(event) {
      tooltip.style("left", (event.clientX + 14) + "px").style("top", (event.clientY + 14) + "px");
    }
    yearMarkG
      .on("mouseenter", (event, d) => {
        const books = (libraryBooks[d.name] || []).filter(b => b.year === d.year);
        const bookLines = books.map(b => {
          const bits = [b.publisher, b.place, b.pubYear].filter(Boolean).join(", ");
          return `${b.title}${bits ? ` (${bits})` : ""}` +
            (b.note ? `<div style="opacity:0.7;font-style:italic">${b.note}</div>` : "");
        });
        tooltip.html(
          `<strong>${d.name} — ${d.year}</strong>` +
          (books.length
            ? `<div style="margin-top:0.2rem;opacity:0.6;font-size:0.7rem;">ANNOTATED COPY IN GADDA'S LIBRARY</div>` +
              bookLines.map(b => `<div style="margin-top:0.15rem;opacity:0.9">${b}</div>`).join("")
            : "no annotated copy for this year") +
""
        );
        tooltip.attr("hidden", null);
        moveTooltip(event);
      })
      .on("mousemove", moveTooltip)
      .on("mouseleave", () => tooltip.attr("hidden", true));

    applyHighlight();

    // focus mode: the timeline starts at Gadda's birth, so anything earlier
    // (lives that began before 1893, a few pre-1893 books) is cut off at the
    // left edge instead of running into the margin. The year axis (drawn
    // first) stays unclipped; everything drawn after it is clipped.
    svg.append("clipPath").attr("id", "timeline-clip")
      .append("rect")
        .attr("x", x(yearMin) - 6).attr("y", 0)
        .attr("width", width).attr("height", height);
    const svgKids = [...svg.node().children];
    const axisIdx = svgKids.findIndex(n => n.querySelector && n.querySelector(".time-label"));
    svgKids.slice(axisIdx + 1)
      .filter(n => n.tagName !== "clipPath" && !n.classList.contains("label-layer"))
      .forEach(n => n.setAttribute("clip-path", "url(#timeline-clip)"));
    svg.select(".label-layer").raise();
  }

  // people added by name through the search box — always shown on top of
  // whatever the filters would otherwise display, regardless of weight.
  let pinnedNames = new Set();
  // a specific year window to zoom the timeline into, set via the "Focus on
  // years" control — null means show the full natural range.
  let timeFocus = null;
  // the name picked from the search box — passed into render() so that
  // person starts highlighted (everyone else dimmed), same as clicking
  // their row directly, instead of just being added as one more plain line.
  let searchSelected = new Set();
  // the dominant book genre to filter to — null means show every genre.
  let activeGenre = null;

  const CUSTOM_MODE = "__custom__";

  function applyFilter() {
    const isCustom = activeGenre === CUSTOM_MODE;
    // "custom" is its own mode, not a genre — it starts with nobody picked
    // by weight at all, just Gadda's own line, and stays that way until you
    // search and pin people into it yourself.
    // when a time focus is active, only people with at least one real
    // interaction year inside that window are eligible — otherwise zooming
    // in just shows whoever the strongest ties overall happen to be, most
    // of them flat lines with nothing going on in the focused years.
    const timeMatching = isCustom
      ? []
      : timeFocus
      ? allCorrespondents.filter(d => (d.interactions || []).some(yr => yr >= timeFocus.start && yr <= timeFocus.end))
      : allCorrespondents;
    const matching = isCustom
      ? timeMatching
      : timeMatching.filter(d =>
          (!activeGenre || genreFor[d.name] === activeGenre) &&
          (!activeCats.size || activeCats.has(genreFor[d.name])) &&
          (!activeLibs.size || [...librariesOf(d.name)].some(l => activeLibs.has(l))));
    const base = isCustom ? [] : matching.slice().sort((a, b) => b.weight - a.weight);
    const baseNames = new Set(base.map(d => d.name));
    const pinnedExtra = allCorrespondents.filter(d => pinnedNames.has(d.name) && !baseNames.has(d.name));
    const shown = [...base, ...pinnedExtra];
    render(shown, searchSelected);

    d3.select("#count-panel").html(
      isCustom
        ? `<div>Your selection</div><strong>${pinnedExtra.length}</strong>` +
          `<div style="margin-top:0.5rem;opacity:0.7;max-width:9rem;">search a name above to add them here</div>`
        : `<div>Shown</div><strong>${shown.length}</strong>` +
          `<div style="margin-top:0.5rem">${timeFocus ? `Active ${timeFocus.start}–${timeFocus.end}` : "Total"}</div><strong>${matching.length}</strong>`
    );

    d3.select("#pinned-chips").selectAll(".pinned-chip")
      .data([...pinnedNames])
      .join("div")
        .attr("class", "pinned-chip")
        .text(d => d)
        .on("click", (event, d) => { pinnedNames.delete(d); searchSelected.delete(d); applyFilter(); });
    if (selectionToggleReady) syncSelectionToggle(); // the switch is built after the first draw
    syncFacetCounts();
  }

  // --- search box: type a name, click a suggestion to pin them into view ---
  const searchInput = d3.select("#search-input");
  const searchSuggestions = d3.select("#search-suggestions");
  searchInput.on("input", function () {
    const q = this.value.trim().toLowerCase();
    searchSuggestions.html("");
    if (!q) return;
    const matches = allCorrespondents
      .filter(d => d.name.toLowerCase().includes(q) && !pinnedNames.has(d.name))
      .slice(0, 8);
    searchSuggestions.selectAll(".search-suggestion")
      .data(matches)
      .join("div")
        .attr("class", "search-suggestion")
        .text(d => d.name)
        .on("click", (event, d) => {
          pinnedNames.add(d.name);
          searchSelected.add(d.name);
          searchInput.property("value", "");
          searchSuggestions.html("");
          applyFilter();
        });
  });
  // clicking away closes the suggestion list
  d3.select(document.body).on("click", (event) => {
    if (!event.target.closest(".search-box")) searchSuggestions.html("");
  });

  // --- time focus: zoom the x-axis to a specific year window ---
  d3.select("#time-focus-apply").on("click", () => {
    const start = +d3.select("#time-focus-start").property("value");
    const end = +d3.select("#time-focus-end").property("value");
    if (!start || !end || start >= end) return;
    timeFocus = { start, end };
    searchSelected = new Set();
    applyFilter();
  });
  d3.select("#time-focus-clear").on("click", () => {
    timeFocus = null;
    searchSelected = new Set();
    d3.select("#time-focus-start").property("value", "");
    d3.select("#time-focus-end").property("value", "");
    applyFilter();
  });

  // --- genre filter bar: which subject dominates this person's books in
  // Gadda's own library (Italian literature, art history, philosophy, etc.)
  const genreValues = Array.from(new Set(allCorrespondents.map(d => genreFor[d.name]).filter(Boolean))).sort();
  const genreFilterBar = d3.select("#genre-filter");
  genreFilterBar.append("button")
    .attr("class", "filter-btn active")
    .attr("data-value", "__all__")
    .text("All")
    .on("click", function () {
      activeGenre = null;
      searchSelected = new Set();
      d3.selectAll("#genre-filter .filter-btn").classed("active", false);
      d3.select(this).classed("active", true);
      applyFilter();
    });
  genreValues.forEach(genre => {
    genreFilterBar.append("button")
      .attr("class", "filter-btn")
      .attr("data-value", genre)
      .text(genre)
      .on("click", function () {
        activeGenre = genre;
        searchSelected = new Set();
        d3.selectAll("#genre-filter .filter-btn").classed("active", false);
        d3.select(this).classed("active", true);
        applyFilter();
      });
  });
  genreFilterBar.append("button")
    .attr("class", "filter-btn")
    .attr("data-value", CUSTOM_MODE)
    .text("★ My selection")
    .on("click", function () {
      activeGenre = CUSTOM_MODE;
      searchSelected = new Set();
      d3.selectAll("#genre-filter .filter-btn").classed("active", false);
      d3.select(this).classed("active", true);
      applyFilter();
    });

  // arriving here via a cross-graph link (?focus=Name) pins and highlights
  // that person immediately, same as picking them from the search box.
  const focusParam = new URLSearchParams(location.search).get("focus");
  if (focusParam && allCorrespondents.some(d => d.name === focusParam)) {
    pinnedNames.add(focusParam);
    searchSelected = new Set([focusParam]);
  }

  applyFilter();

  // --- category legend: one swatch per category, with how many people
  // fall in it (built once, since categories don't change with filtering).
  // Each row is also a toggle: click to add that category to what's shown,
  // click again to remove it — several can be combined. With none picked,
  // every category is shown.
  const legendSection = d3.select("#side-panel").append("section");
  legendSection.append("h2").text("Categories · click to combine");
  const categoryLegend = legendSection.append("div").attr("class", "category-legend");
  function pressFilter(value) {
    const btn = document.querySelector(`#genre-filter .filter-btn[data-value="${CSS.escape(value)}"]`);
    if (btn) btn.click();
  }
  Object.entries(genreColors).forEach(([cat, color]) => {
    const n = allCorrespondents.filter(d => genreFor[d.name] === cat).length;
    if (!n) return;
    const row = categoryLegend.append("div")
      .attr("class", "legend-row")
      .attr("data-cat", cat)
      .attr("title", "Add or remove " + cat)
      .on("click", () => {
        if (activeCats.has(cat)) activeCats.delete(cat);
        else activeCats.add(cat);
        // "All" in the hidden menu leaves My selection and redraws with the set
        pressFilter("__all__");
        syncLegend();
        syncSelectionToggle();
      });
    row.append("span").attr("class", "swatch").style("background", color);
    row.append("span").text(cat);
    row.append("span").attr("class", "n");
  });
  const clearCats = legendSection.append("button")
    .attr("class", "filter-btn clear-cats")
    .text("Show all categories")
    .on("click", () => { activeCats.clear(); pressFilter("__all__"); syncLegend(); syncSelectionToggle(); });
  function syncLegend() {
    categoryLegend.classed("filtering", activeCats.size > 0);
    categoryLegend.selectAll(".legend-row").classed("active", function () { return activeCats.has(this.dataset.cat); });
    clearCats.style("display", activeCats.size ? null : "none");
  }
  syncLegend();

  // --- library legend: which library holds the person's books. Same
  // behaviour as the categories above — click to add, click again to
  // remove, combine several — and it combines with the categories.
  const libraryLabels = {
    BTB: "Biblioteca Teatrale del Burcardo",
    BAL: "Biblioteca dell'archivio Liberati",
    BTM: "Biblioteca Trivulziana Milano",
    BAC: "Biblioteca dell'archivio contemporaneo \"Alessandro Bonsanti\"",
    [NO_LIBRARY]: "Library not recorded",
  };
  const libSection = d3.select("#side-panel").append("section");
  libSection.append("h2").text("Libraries · click to combine");
  const libLegend = libSection.append("div").attr("class", "category-legend");
  Object.keys(libraryLabels).forEach(lib => {
    const n = allCorrespondents.filter(d => librariesOf(d.name).has(lib)).length;
    if (!n) return;
    const row = libLegend.append("div")
      .attr("class", "legend-row")
      .attr("data-lib", lib)
      .attr("title", "Add or remove " + libraryLabels[lib])
      .on("click", () => {
        if (activeLibs.has(lib)) activeLibs.delete(lib);
        else activeLibs.add(lib);
        pressFilter("__all__");
        syncLibLegend();
        syncSelectionToggle();
      });
    row.append("span").text(libraryLabels[lib]);
    row.append("span").attr("class", "n");
  });
  const clearLibs = libSection.append("button")
    .attr("class", "filter-btn clear-cats")
    .text("Show all libraries")
    .on("click", () => { activeLibs.clear(); pressFilter("__all__"); syncLibLegend(); syncSelectionToggle(); });
  function syncLibLegend() {
    libLegend.classed("filtering", activeLibs.size > 0);
    libLegend.selectAll(".legend-row").classed("active", function () { return activeLibs.has(this.dataset.lib); });
    clearLibs.style("display", activeLibs.size ? null : "none");
  }
  syncLibLegend();

  // --- the two legends adapt to each other: each category's count is the
  // people who match the libraries picked (and the year focus), and each
  // library's count is the people who match the categories picked. A row
  // that would show nobody is greyed out and can't be clicked (unless it's
  // already picked, so it can still be removed).
  syncFacetCounts = () => {
    const eligible = timeFocus
      ? allCorrespondents.filter(d => (d.interactions || []).some(yr => yr >= timeFocus.start && yr <= timeFocus.end))
      : allCorrespondents;
    const libOk = d => !activeLibs.size || [...librariesOf(d.name)].some(l => activeLibs.has(l));
    const catOk = d => !activeCats.size || activeCats.has(genreFor[d.name]);
    const update = (legend, attr, picked, peopleIn) => {
      legend.selectAll(".legend-row").each(function () {
        const key = this.dataset[attr];
        const n = peopleIn(key);
        d3.select(this).classed("empty", !n && !picked.has(key)).select(".n").text(n);
      });
    };
    update(categoryLegend, "cat", activeCats,
      cat => eligible.filter(d => libOk(d) && genreFor[d.name] === cat).length);
    update(libLegend, "lib", activeLibs,
      lib => eligible.filter(d => catOk(d) && librariesOf(d.name).has(lib)).length);
  };
  syncFacetCounts();

  // --- reparti: the graphs this one links to (cross-links, download name).
  // Switching between them is done from gadda-browse.html's top tab bar.
  const reparti = [
    { key: "letters", label: "Letters", file: "gadda-reparto-letter-range-declutter.html", accent: "#6d2a9e" },
    { key: "library", label: "Library", file: "gadda-reparto-library-declutter.html", accent: "#c05727" },
    { key: "secondaryBib", label: "Secondary bibliography", file: "gadda-reparto-secondary-bibliography-declutter.html", accent: "#1d4e9e" },
    { key: "archive", label: "Archive", file: "gadda-reparto-archive.html", accent: "#9e1d47" },
    { key: "undifferentiated", label: "Everyone (undifferentiated)", file: "gadda-reparto-undifferentiated.html", accent: "#4a5059" },
  ];
  const thisFile = location.pathname.split("/").pop();
  // --- which graph: the switcher that used to be the browse page's top
  // bar, now a drop-down at the top of this sidebar so the graph gets the
  // whole window. Inside gadda-browse.html it asks the browse page to switch
  // (keeping its URL in sync); opened on its own, it goes to the other file.
  const graphSection = d3.select("#side-panel").insert("section", ":first-child").attr("class", "graph-switch");
  graphSection.append("h2").text("Graph");
  const graphSelect = graphSection.append("select").attr("class", "graph-select")
    .on("change", function () {
      const r = reparti.find(r => r.key === this.value);
      if (!r || r.file === thisFile) return;
      let parentOpen = null;
      try {
        if (window.parent !== window && typeof window.parent.openReparto === "function") parentOpen = window.parent.openReparto;
      } catch (e) { /* parent not reachable (e.g. file://) */ }
      if (parentOpen) parentOpen(r.key);
      else location.href = r.file;
    });
  graphSelect.selectAll("option").data(reparti).join("option")
    .attr("value", r => r.key)
    .property("selected", r => r.file === thisFile)
    .text(r => r.label);
  // switching between reparti happens from the browse page's top tab bar;
  // this section only holds the colour-dot hint, below the browsing tools
  const repartiSection = d3.select("#side-panel").append("section");

  // --- "Also in other reparti": for each selected person who appears in
  // other graphs, a button per graph that opens them there, already
  // selected (via ?focus=). Inside gadda-browse.html the browse page does
  // the switching, so its tabs stay in sync.
  function openReparto(key, name) {
    const r = reparti.find(r => r.key === key);
    if (!r) return;
    let parentOpen = null;
    try {
      if (window.parent !== window && typeof window.parent.openReparto === "function") parentOpen = window.parent.openReparto;
    } catch (e) { /* parent not reachable (e.g. file://) */ }
    if (parentOpen) parentOpen(key, name);
    else location.href = `${r.file}?focus=${encodeURIComponent(name)}`;
  }
  const crossSection = d3.select("#side-panel").insert("section", () => repartiSection.node()).attr("class", "cross-links");
  crossSection.append("h2").text("Also in other reparti");
  const crossBody = crossSection.append("div");
  updateCrossLinks = names => {
    const linked = names
      .filter(n => n !== "Gadda Carlo Emilio")
      .map(n => ({ name: n, keys: otherReparti(n) })) // the undifferentiated graph holds everyone, so it's never listed
      .filter(p => p.keys.length);
    crossSection.style("display", linked.length ? null : "none");
    crossBody.html("");
    linked.forEach(p => {
      const item = crossBody.append("div").attr("class", "cross-person");
      item.append("div").attr("class", "cross-name").text(p.name);
      const btns = item.append("div").attr("class", "cross-btns");
      p.keys.forEach(k => btns.append("button")
        .attr("class", "filter-btn cross-btn")
        .style("--accent", repartoAccents[k])
        .text(repartoLabels[k])
        .on("click", () => openReparto(k, p.name)));
    });
  };
  updateCrossLinks(lastSelectedNames);
  repartiSection.append("div").attr("class", "xref-hint")
    .html('<span class="xref-dot-sample">●</span> after a name: that person also appears in the reparto of that colour. Click a line to see the links.');

  // --- "My selection": a switch in the sidebar between everyone and only
  // the people you've added with the search box (plus Gadda). It drives the
  // same mode the old hidden menu had; categories and libraries picked in
  // the legends are dropped when you switch, since My selection ignores them.
  const selectionSection = d3.select("#search-input").node().closest("section");
  const viewToggle = d3.select(selectionSection).insert("div", ".search-box").attr("class", "view-toggle");
  const selectionHint = d3.select(selectionSection).append("div").attr("class", "selection-hint");
  const shownCount = d3.select(selectionSection).insert("div", ".view-toggle").attr("class", "shown-count");
  // three ways to choose who is drawn: the most active (default), everyone
  // matching the current filters and year focus, or only your own picks
  viewToggle.append("button").attr("class", "filter-btn").attr("data-mode", "top").text("Most active")
    .on("click", () => { topN = TOP_N_DEFAULT; setSelectionMode(false); });
  viewToggle.append("button").attr("class", "filter-btn").attr("data-mode", "all").text("Show all")
    .on("click", () => { topN = null; setSelectionMode(false); });
  viewToggle.append("button").attr("class", "filter-btn").attr("data-mode", "custom").text("★ My selection")
    .on("click", () => setSelectionMode(true));
  const orderToggle = d3.select(selectionSection).insert("div", ".search-box").attr("class", "view-toggle order-toggle");
  const orderTitles = {
    year: "Rows sorted by year, half above Gadda and half below; people with (nearly) the same year are ordered to cross less",
    balanced: "Rows in year order on both sides of Gadda; people whose lines dip at the same time are put on opposite sides, where they can't cross",
    crossings: "Sorted by year, then neighbouring rows swapped wherever that makes lines cross less (order only roughly chronological)",
  };
  [["year", "By year"], ["balanced", "Balanced sides"], ["crossings", "Fewest crossings"]].forEach(([key, label]) => {
    orderToggle.append("button").attr("class", "filter-btn").attr("data-order", key).text(label)
      .attr("title", orderTitles[key])
      .on("click", () => {
        if (rowOrder === key) return;
        rowOrder = key;
        try { localStorage.setItem("gadda-row-order", key); } catch (e) {}
        syncOrderToggle();
        applyFilter();
      });
  });
  function syncOrderToggle() {
    orderToggle.selectAll(".filter-btn").classed("active", function () { return this.dataset.order === rowOrder; });
  }
  syncOrderToggle();
  const dipToggle = d3.select(selectionSection).insert("div", ".search-box").attr("class", "view-toggle dip-toggle");
  [["close", "Dips: close"], ["lanes", "Dips: lanes"]].forEach(([key, label]) => {
    dipToggle.append("button").attr("class", "filter-btn").attr("data-dip", key).text(label)
      .attr("title", key === "close"
        ? "Lines in contact come right up to Gadda's line; stronger ties come closer"
        : "Lines in contact run in their own lane beside Gadda's line, side by side")
      .on("click", () => {
        if (dipStyle === key) return;
        dipStyle = key;
        try { localStorage.setItem("gadda-dip-style", key); } catch (e) {}
        syncDipToggle();
        applyFilter();
      });
  });
  function syncDipToggle() {
    dipToggle.selectAll(".filter-btn").classed("active", function () { return this.dataset.dip === dipStyle; });
  }
  syncDipToggle();
  function setSelectionMode(on) {
    if (on && typeof activeCats !== "undefined") activeCats.clear(); // My selection ignores categories
    if (on) activeLibs.clear(); // ...and libraries
    const btn = document.querySelector(`#genre-filter .filter-btn[data-value="${on ? "__custom__" : "__all__"}"]`);
    if (btn) btn.click();
    if (typeof syncLegend === "function") syncLegend();
    if (typeof syncLibLegend === "function") syncLibLegend();
    syncSelectionToggle();
  }
  function syncSelectionToggle() {
    const on = activeGenre === CUSTOM_MODE;
    const mode = on ? "custom" : topN == null ? "all" : "top";
    downloadBtn
      .style("display", on ? null : "none")
      .property("disabled", on && !pinnedNames.size);
    viewToggle.selectAll(".filter-btn").classed("active", function () { return this.dataset.mode === mode; });
    selectionHint.text(on
      ? (pinnedNames.size ? "Only the people you added are shown. Click a name chip to remove it." : "Your selection is empty: search a name above to add someone.")
      : mode === "all"
      ? "Everyone matching your categories and years is drawn."
      : "Names you add with search are always shown, on top of these.");
    // how many people are drawn, out of how many — the graph only draws the
    // most active by default, so this keeps the reduced view honest
    const { shown, total } = topNStats;
    const everyone = allCorrespondents.length;
    shownCount.html(on
      ? `Your selection: <strong>${shown}</strong> of ${everyone} people`
      : (shown >= total
          ? `Showing ${total === 1 ? "the only" : "all"} <strong>${total}</strong> ${total === 1 ? "person" : "people"}`
          : `Showing <strong>${shown}</strong> of ${total} people`) +
        (total < everyone ? ` matching your filters (${everyone} in all)` : "") +
        (shown < total ? ` — the most active; choose "Show all" to draw everyone` : ""));
  }
  // --- download "My selection" as a PNG or JPG image. Only offered in My
  // selection mode. The page's colours, fonts and line widths come from CSS classes and
  // variables a standalone file can't see, so each element's computed style
  // is written onto the copy; names are laid out as at the start of the
  // timeline, whatever the current scroll position.
  const downloadBtn = d3.select(selectionSection).selectAll(null)
    .data(["png", "jpg"])
    .join("button")
    .attr("class", "filter-btn download-selection")
    .text(format => `⬇ Download my selection (${format.toUpperCase()})`)
    .on("click", (event, format) => downloadSelection(format));
  function downloadSelection(format) {
    const scrollBack = window.scrollX;
    window.scrollTo(0, window.scrollY);
    pinLabels();
    const original = document.querySelector("#graph-svg, .graph-wrap svg");
    const clone = original.cloneNode(true);
    const props = ["fill", "fill-opacity", "stroke", "stroke-width", "stroke-opacity", "stroke-dasharray",
      "stroke-linecap", "stroke-linejoin", "opacity", "visibility", "display", "font-size", "font-weight",
      "font-family", "paint-order", "dominant-baseline", "text-anchor"];
    const src = original.querySelectorAll("*"), dst = clone.querySelectorAll("*");
    src.forEach((el, i) => {
      const cs = getComputedStyle(el);
      dst[i].setAttribute("style", props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(";"));
    });
    window.scrollTo(scrollBack, window.scrollY);
    pinLabels();
    const [, , w, h] = clone.getAttribute("viewBox").split(/[ ,]+/).map(Number);
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    clone.setAttribute("width", w);
    clone.setAttribute("height", h);
    clone.removeAttribute("style");
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("width", w);
    bg.setAttribute("height", h);
    bg.setAttribute("fill", getComputedStyle(document.body).backgroundColor);
    clone.insertBefore(bg, clone.firstChild);
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `Carlo Emilio Gadda — my selection: ${[...pinnedNames].join(", ")}`;
    clone.insertBefore(title, clone.firstChild);
    const source = new XMLSerializer().serializeToString(clone);
    const svgUrl = URL.createObjectURL(new Blob([source], { type: "image/svg+xml;charset=utf-8" }));
    const key = (reparti.find(r => r.file === thisFile) || { key: "graph" }).key;
    // the styled copy is drawn onto a canvas and saved from there; it's
    // rendered at twice its size so the image stays sharp, unless that
    // would go past what browsers allow for one canvas
    const scale = Math.min(2, 16000 / Math.max(w, h));
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(svgUrl);
      const mime = format === "jpg" ? "image/jpeg" : "image/png";
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `gadda-${key}-my-selection.${format}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, mime, 0.92);
    };
    img.onerror = () => {
      URL.revokeObjectURL(svgUrl);
      alert("Couldn't turn the graph into an image in this browser.");
    };
    img.src = svgUrl;
  }

  var selectionToggleReady = true;
  syncSelectionToggle();

  // --- time focus, easier to use: Enter applies, a status line says what's
  // active, and the view jumps back to the window's start whenever the
  // focus changes.
  const timeFocusBox = d3.select(".time-focus");
  const focusStatus = timeFocusBox.append("div").attr("class", "time-focus-status");
  function updateFocusStatus() {
    focusStatus.text(timeFocus
      ? `Showing ${timeFocus.start}–${timeFocus.end}: strength and order recalculated for these years only.`
      : "Showing Gadda's whole life.");
  }
  d3.selectAll("#time-focus-start, #time-focus-end").on("keydown", event => {
    if (event.key === "Enter") document.getElementById("time-focus-apply").click();
  });
  ["time-focus-apply", "time-focus-clear"].forEach(id =>
    document.getElementById(id).addEventListener("click", () => {
      window.scrollTo(0, 0);
      pinLabels();
      updateFocusStatus();
    }));
  updateFocusStatus();

  // --- zoom: stretch or squeeze the timeline (how many pixels each year
  // gets), keeping the year under the pointer — or the middle of the view —
  // where it is. Pinch on a trackpad or Ctrl/⌘ + wheel over the graph, or the
  // − / + / Fit buttons at the top right. The graph is redrawn at the new
  // scale (nothing is stretched), and the current selection is kept.
  const sidebarW = () => document.getElementById("side-panel").offsetWidth;
  // the narrowest the timeline can be: the whole span fits the window
  function fitPxPerYear() {
    const { x, unitsPerPx, marginLR } = zoomState;
    const [y0, y1] = x.domain();
    return Math.max(1, (window.innerWidth - sidebarW() - marginLR / unitsPerPx) / (y1 - y0));
  }
  function rerenderKeepingSelection() {
    searchSelected = new Set(lastSelectedNames);
    applyFilter();
  }
  let pendingZoom = null;
  function zoomBy(factor, clientX) {
    const anchor = clientX ?? sidebarW() + (window.innerWidth - sidebarW()) / 2;
    // wheel ticks arriving close together are combined into one redraw
    const first = !pendingZoom;
    pendingZoom = { factor: (pendingZoom ? pendingZoom.factor : 1) * factor, anchor };
    if (first) setTimeout(applyZoom, 30);
  }
  function applyZoom() {
    if (!pendingZoom || !zoomState) return;
    const { factor, anchor } = pendingZoom;
    pendingZoom = null;
    const anchorYear = zoomState.x.invert((window.scrollX + anchor - sidebarW()) * zoomState.unitsPerPx);
    const fit = fitPxPerYear();
    const next = Math.min(MAX_PX_PER_YEAR, Math.max(fit, Math.max(pxPerYear, fit) * factor));
    if (Math.abs(next - Math.max(pxPerYear, fit)) < 0.01) return;
    pxPerYear = next;
    rerenderKeepingSelection();
    const left = zoomState.x(anchorYear) / zoomState.unitsPerPx - (anchor - sidebarW());
    window.scrollTo(Math.max(0, left), window.scrollY);
    pinLabels();
    updateReadout();
    updateZoomLabel();
  }
  function fitZoom() {
    pxPerYear = 1; // anything below the fit width draws the whole span in the window
    rerenderKeepingSelection();
    window.scrollTo(0, window.scrollY);
    pinLabels();
    updateReadout();
    updateZoomLabel();
  }
  const zoomCtl = d3.select("body").append("div").attr("class", "zoom-ctl")
    .attr("title", "Pinch, or Ctrl/⌘ + scroll over the graph, to zoom");
  zoomCtl.append("button").text("−").attr("aria-label", "Zoom out").on("click", () => zoomBy(1 / 1.5));
  const zoomLabel = zoomCtl.append("span").attr("class", "zoom-level");
  zoomCtl.append("button").text("+").attr("aria-label", "Zoom in").on("click", () => zoomBy(1.5));
  zoomCtl.append("button").attr("class", "zoom-fit").text("Fit").on("click", fitZoom);
  function updateZoomLabel() {
    if (!zoomState) return;
    const effective = Math.max(pxPerYear, fitPxPerYear());
    zoomLabel.text(`${Math.round(effective / BASE_PX_PER_YEAR * 100)}%`);
  }
  updateZoomLabel();

  // --- retractable sidebar: the tab on its edge hides or shows it. Hidden,
  // the graph takes the whole window width; it's redrawn for the new width,
  // keeping the year at the left edge and the current selection. The choice
  // is remembered for next time (when the browser allows it).
  const SIDEBAR_KEY = "gadda-sidebar-collapsed";
  const sideToggle = d3.select("body").append("button")
    .attr("class", "side-toggle")
    .on("click", () => setSidebar(!document.body.classList.contains("side-collapsed")));
  function setSidebar(collapsed, redraw = true) {
    const leftYear = zoomState
      ? zoomState.x.invert(Math.max(zoomState.marginLR / 2, window.scrollX * zoomState.unitsPerPx))
      : null;
    document.body.classList.toggle("side-collapsed", collapsed);
    sideToggle
      .text(collapsed ? "›" : "‹")
      .attr("title", collapsed ? "Show the menu" : "Hide the menu")
      .attr("aria-label", collapsed ? "Show the menu" : "Hide the menu");
    try { localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0"); } catch (e) { /* storage unavailable */ }
    if (!redraw) return;
    rerenderKeepingSelection();
    if (leftYear != null) window.scrollTo(Math.max(0, zoomState.x(leftYear) / zoomState.unitsPerPx - 12), window.scrollY);
    pinLabels();
    updateReadout();
    updateZoomLabel();
  }
  let startCollapsed = false;
  try { startCollapsed = localStorage.getItem(SIDEBAR_KEY) === "1"; } catch (e) { /* storage unavailable */ }
  setSidebar(startCollapsed, startCollapsed);

  // focus mode: a plain vertical wheel/trackpad scroll moves along the
  // timeline, since there's nothing to scroll vertically anymore.
  window.addEventListener("wheel", event => {
    if (event.target.closest && event.target.closest(".side-panel")) return; // let the sidebar scroll normally
    if (event.ctrlKey || event.metaKey) {
      // pinch on a trackpad (reported as ctrl + wheel) or Ctrl/⌘ + wheel: zoom
      event.preventDefault();
      // a mouse-wheel notch (~100) is capped to about ×1.4; a pinch sends many
      // small deltas, so it zooms smoothly
      const delta = Math.max(-60, Math.min(60, event.deltaY));
      zoomBy(Math.exp(-delta * 0.006), event.clientX);
      return;
    }
    if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
      window.scrollBy(event.deltaY, 0);
      event.preventDefault();
    }
  }, { passive: false });
  window.addEventListener("scroll", () => { pinLabels(); updateReadout(); }, { passive: true });
</script>
</body>
</html>
